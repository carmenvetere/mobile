clean_basement:
  alias: Clean Basement
  sequence:
  - service: vacuum.send_command
    metadata: {}
    data:
      command: app_segment_clean
      params:
      - segments:
        - 16
        - 17
        - 18
        - 20
        - 21
        repeat: 1
    target:
      entity_id: vacuum.roborock_s8
  description: ''
  icon: mdi:vacuum-outline
reset_vacuum_timer:
  alias: Reset Vacuum Timer
  sequence:
  - service: input_datetime.set_datetime
    target:
      entity_id: input_datetime.last_pool_vacuum
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  description: ''
  icon: mdi:pool
reset_lower_floors_filter_runtime:
  alias: reset_lower_floors_filter_runtime
  sequence:
  - target:
      entity_id: input_datetime.lower_floors_air_filter_last_reset
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    action: input_datetime.set_datetime
  - action: input_number.set_value
    metadata: {}
    target:
      entity_id: input_number.lower_floors_hvac_filter_hours
    data:
      value: 0
  description: ''
reset_upper_floors_filter_runtime:
  alias: reset_upper_floors_filter_runtime
  sequence:
  - target:
      entity_id: input_datetime.upper_floor_air_filter_last_reset
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    action: input_datetime.set_datetime
  - action: input_number.set_value
    metadata: {}
    target:
      entity_id: input_number.upper_floor_hvac_filter_hours
    data:
      value: 0
  description: ''
reset_hot_water_last_flushed_date:
  sequence:
  - target:
      entity_id: input_datetime.water_heater_last_flushed
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    action: input_datetime.set_datetime
  alias: Reset Hot Water Last Flushed Date
  description: ''
  icon: mdi:water-boiler-alert
reset_dryer_vent_last_cleaned_date:
  sequence:
  - target:
      entity_id: input_datetime.dryer_vent_last_cleaned
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    action: input_datetime.set_datetime
  alias: Reset Dryer Vent Last Cleaned Date
  description: ''
  icon: mdi:tumble-dryer
push_live_activity:
  alias: Push Live Activity
  description: >-
    Reusable iOS Live Activity delivery (#179). Fans out one mobile_app notify
    per recipient by audience (both|carmen|brian), injecting tag + live_update
    into the payload dict. Per-activity automations call this instead of
    repeating notify blocks.
  mode: parallel
  max: 25
  icon: mdi:cellphone-message
  fields:
    tag:
      description: Unique activity tag; same tag updates the card in place.
    title:
      description: Static Live Activity title.
    message:
      description: Body line (may change between updates).
    payload:
      description: Extra notify data keys (progress, chronometer, when, icons, ...).
    audience:
      description: both | carmen | brian (default both).
  variables:
    audience: "{{ audience | default('both') }}"
    payload: "{{ payload | default({}) }}"
    recipients: >-
      {{ ['notify.mobile_app_carmens_iphone'] if audience == 'carmen'
         else ['notify.mobile_app_brians_iphone_15_pro'] if audience == 'brian'
         else ['notify.mobile_app_carmens_iphone', 'notify.mobile_app_brians_iphone_15_pro'] }}
  sequence:
  - repeat:
      for_each: "{{ recipients }}"
      sequence:
      - action: "{{ repeat.item }}"
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          # Dark background + light text as defaults (a caller's payload can
          # override); tag + live_update always win. These are documented iOS
          # Live Activity fields.
          data: >-
            {{ {'background_color': '#14161A', 'text_color': '#FFFFFF'}
               | combine(payload)
               | combine({'tag': tag, 'live_update': true}) }}
shades_latch_manual:
  alias: Shades - Latch Room to Manual
  description: >-
    v2.4.1: the one place a room's input_boolean.shades_manual_* latch gets
    set by the Pico remotes. Those automations drive the covers themselves, so
    their cover events carry a parent_id and the Manual Control Detector
    deliberately ignores them - they latch explicitly, and before v2.4.1 they
    did it unconditionally at any hour and in any room state.
    A manual latch only means something while the Shade Scheduler is actually
    managing the room, so it is refused in two cases:
    (1) outside the scheduler's own active window (07:29-20:01). A press
    before the morning open latched the room out of the very open it was
    waiting for, so the shades never took an adaptive position all day and it
    read as "the overnight reset didn't happen". After 20:01 the scheduler is
    done for the day and the latch would only sit there until 03:00.
    (2) while the room is paused (Overnight Guests for the guest rooms, Dinner
    Party for the First Floor). A paused room is already skipped end-to-end,
    so latching it does nothing at the time and leaves a latch that outlives
    the pause - which is why a guest room stayed out of adaptive after
    Overnight Guests was switched off.
    A refused latch is a silent no-op: the condition ends this script only,
    never the calling automation, so the shades still move.
  mode: parallel
  max: 10
  icon: mdi:hand-back-right
  fields:
    latch:
      description: The room's input_boolean.shades_manual_* entity.
    pause:
      description: >-
        The room's pause helper in the scheduler's rooms table
        (input_boolean.guest_mode / .dinner_party). Omit for a room with none.
  variables:
    pause: "{{ pause | default('') }}"
  sequence:
  - condition: time
    after: '07:29:00'
    before: '20:01:00'
  - condition: template
    value_template: "{{ pause == '' or not is_state(pause, 'on') }}"
  - action: input_boolean.turn_on
    target:
      entity_id: "{{ latch }}"
clear_live_activity:
  alias: Clear Live Activity
  description: >-
    Clears an iOS Live Activity by tag for the chosen audience (#179).
  mode: parallel
  max: 25
  icon: mdi:cellphone-remove
  fields:
    tag:
      description: Activity tag to clear.
    audience:
      description: both | carmen | brian (default both).
  variables:
    audience: "{{ audience | default('both') }}"
    recipients: >-
      {{ ['notify.mobile_app_carmens_iphone'] if audience == 'carmen'
         else ['notify.mobile_app_brians_iphone_15_pro'] if audience == 'brian'
         else ['notify.mobile_app_carmens_iphone', 'notify.mobile_app_brians_iphone_15_pro'] }}
  sequence:
  - repeat:
      for_each: "{{ recipients }}"
      sequence:
      - action: "{{ repeat.item }}"
        data:
          message: clear_notification
          data:
            tag: "{{ tag }}"
sprinkler_pause_briefly:
  alias: Sprinkler Pause Briefly
  description: Pauses the running Rachio schedule for 10 minutes (enough to take
    the dog out) and starts timer.sprinkler_pause so the dashboard can show the
    Paused state and countdown. Rachio resumes on its own when the pause window
    expires; "Sprinklers - Resume After Pause Timer" is the backstop. Targets the
    controller entity (switch.rachio_c3e715_standby), same one the outage
    automations use. Known limitation (accepted by design) - pause_watering
    pauses the running SCHEDULE; a manual zone run started from a switch may not
    resume by itself, which the pop-up's paused note calls out.
  icon: mdi:pause
  mode: single
  sequence:
  - action: rachio.pause_watering
    data:
      duration: 10
    target:
      entity_id: switch.rachio_c3e715_standby
  - action: timer.start
    data:
      duration: "00:10:00"
    target:
      entity_id: timer.sprinkler_pause
sprinkler_resume_now:
  alias: Sprinkler Resume Now
  description: Resumes the paused Rachio schedule immediately and cancels the
    pause timer so the pop-up returns to Watering now.
  icon: mdi:play
  mode: single
  sequence:
  - action: rachio.resume_watering
    target:
      entity_id: switch.rachio_c3e715_standby
  - action: timer.cancel
    target:
      entity_id: timer.sprinkler_pause
sprinkler_stop_all:
  alias: Sprinkler Stop All
  description: Stops watering entirely - turns off all seven zone switches (the
    individual zones, not the group, so a partially-running schedule is fully
    stopped) and cancels the pause timer. The header chip disappears once the
    zone group reports off.
  icon: mdi:stop
  mode: single
  sequence:
  - action: switch.turn_off
    target:
      entity_id:
      - switch.front_180s
      - switch.front_and_side_90s
      - switch.pool_180s
      - switch.pool_90s
      - switch.pool_shrubs
      - switch.firepit_shrubs
      - switch.retaining_wall_drip
  - action: timer.cancel
    target:
      entity_id: timer.sprinkler_pause
