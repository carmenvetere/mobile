  # ---- Speaker volumes sheet (#music-volumes) — top drawer like the nav sheet
  - type: custom:bubble-card
    card_type: pop-up
    hash: "#music-volumes"
    button_type: name
    name: Speaker volumes
    icon: mdi:tune-vertical-variant
    show_header: true
    close_on_click: false
    scrolling_effect: false
    margin_top_mobile: 0px
    margin_top_desktop: 0px
    styles: |
      @keyframes nav-sheet-drop {
        from { transform: translateY(-28px); opacity: 0; }
        to   { transform: translateY(0);     opacity: 1; }
      }
      .bubble-pop-up {
        --bubble-pop-up-background-color: var(--secondary-background-color) !important;
        --bubble-pop-up-main-background-color: var(--secondary-background-color) !important;
        --bubble-pop-up-border-radius: 15px 15px 0 0 !important;
        --bubble-pop-up-content-border-radius: 15px 15px 0 0 !important;
        box-shadow: 0 16px 44px rgba(0,0,0,0.55) !important;
        animation: nav-sheet-drop 0.25s ease-out !important;
        overflow-y: auto !important;
        max-height: 92vh !important;
      }
      .bubble-icon-container { background: transparent !important; }
      .bubble-icon { color: var(--primary-text-color) !important; }
      .bubble-name { font-size: 18px !important; font-weight: 700 !important; color: var(--primary-text-color) !important; }
      .bubble-close-button {
        width: 40px !important; height: 40px !important; border-radius: 999px !important;
        background: var(--background-color-2) !important;
      }
