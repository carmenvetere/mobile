title: Music
icon: mdi:music
theme: Dune Mist
path: music
type: custom:grid-layout
cards:
  # Hamburger nav sheet (standalone pop-up; keep as its own top-level card)
  - !include [/config/dashboards/modules/mobile-nav-sheet.yaml, {current: music}]
  - type: custom:button-card
    # grid-layout item: let the card shrink below its content width so wide
    # charts/pop-ups never push the header off narrow screens.
    card_mod:
      style: |
        :host { min-width: 0 !important; }
    styles:
      card:
        - border-radius: 0
        - box-shadow: none
        - background: var(--primary-background-color)
        - padding: 2px 5px 24px 5px
        - margin: 0
        - height: auto
        - box-sizing: border-box
        - max-width: 100%
        - min-width: 0
      grid:
        - grid-template-areas: |
            "header"
            "player"
            "music"
        - grid-template-columns: minmax(0, 1fr)
        - grid-template-rows: 60px auto auto
        - row-gap: 0px
        - column-gap: 2px
        - align-items: start
    custom_fields:
      header:
        card:
          type: custom:button-card
          icon: mdi:music
          name: Music
          show_state: false
          show_label: true
          tap_action: { action: none }
          label: |
            [[[
              var rooms = ['living_room','kitchen','office','gym','deck','pool','mud_room','media_room'];
              var n = 0;
              rooms.forEach(function(r){
                var s = states['media_player.' + r];
                if (s && s.state === 'playing') n++;
              });
              return n > 0 ? ('Playing in ' + n + (n === 1 ? ' room' : ' rooms')) : 'Idle';
            ]]]
          styles:
            card:
              - background: transparent !important
              - --ha-card-background: transparent
              - box-shadow: none
              - transition: none
              - padding: 4px 2px 6px
            grid:
              - grid-template-areas: '"back i n menu" "back i l menu"'
              - grid-template-columns: 24px 40px 1fr 40px
              - grid-template-rows: auto auto
              - align-items: center
              - column-gap: 8px
            img_cell:
              - grid-area: i
              - width: 40px
              - height: 40px
            icon:
              - width: 24px
              - color: var(--primary-text-color)
            name:
              - grid-area: n
              - justify-self: start
              - font-size: 22px
              - font-weight: 700
              - color: var(--primary-text-color)
            label:
              - grid-area: l
              - justify-self: start
              - font-size: 14px
              - color: var(--secondary-text-color)
            custom_fields:
              back:
                - grid-area: back
                - align-self: center
                - justify-self: start
                - margin-left: -8px
              menu:
                - grid-area: menu
                - align-self: center
                - justify-self: end
          custom_fields:
            back:
              card: !include /config/dashboards/modules/mobile-header-back.yaml
            menu:
              card: !include /config/dashboards/modules/mobile-header-hamburger.yaml
      player:
        card:
          # Which player the card below controls. Auto follows whatever is
          # playing (its chip names the resolved room); tap a room to pin it.
          # Highlighted chip = the pinned choice; volume icon = room is playing.
          type: custom:mushroom-chips-card
          alignment: start
          card_mod:
            style: |
              ha-card { overflow: hidden !important; margin: 2px 5px 6px !important; }
              ha-card > * {
                display: flex !important; flex-wrap: nowrap !important;
                overflow-x: auto !important; overflow-y: hidden !important; gap: 8px !important;
                scrollbar-width: none;
              }
              ha-card > *::-webkit-scrollbar { display: none; }
              ha-card > * > * { flex-shrink: 0 !important; }
          chips:
            - type: template
              entity: input_select.music_player
              icon: mdi:autorenew
              content: >-
                {% set rooms = {'media_player.living_room': 'Living Room', 'media_player.kitchen': 'Kitchen', 'media_player.office': 'Office', 'media_player.gym': 'Gym', 'media_player.deck': 'Deck', 'media_player.pool': 'Pool', 'media_player.mud_room': 'Mud Room', 'media_player.media_room': 'Media Room'} %}
                {% set playing = rooms.keys() | select('is_state', 'playing') | list %}
                {% set ns = namespace(c=none) %}
                {% for e in playing %}{% set g = state_attr(e, 'group_members') or [] %}
                  {% if ns.c is none and (g | length == 0 or g[0] == e) %}{% set ns.c = e %}{% endif %}
                {% endfor %}
                {% set cur = ns.c or (playing[0] if playing else 'media_player.living_room') %}
                Auto{% if is_state('input_select.music_player', 'Auto') %} · {{ rooms[cur] }}{% endif %}
              tap_action:
                action: perform-action
                perform_action: input_select.select_option
                target:
                  entity_id: input_select.music_player
                data:
                  option: Auto
              card_mod:
                style: |
                  ha-card {
                    --chip-background: {{ 'var(--slate-alpha-55, rgba(142,177,191,0.55))' if is_state('input_select.music_player', 'Auto') else 'var(--background-color-2)' }};
                    --chip-height: 40px;
                    --chip-font-size: 14px;
                    --chip-font-weight: 600;
                    --chip-border-radius: 999px;
                    --chip-padding: 0 14px;
                    --chip-icon-size: 18px;
                    --chip-text-color: var(--primary-text-color);
                    --chip-icon-color: var(--primary-text-color);
                  }
            - type: template
              entity: input_select.music_player
              icon: "{{ 'mdi:volume-high' if is_state('media_player.living_room', 'playing') else 'mdi:speaker' }}"
              content: >-
                Living Room
              tap_action:
                action: perform-action
                perform_action: input_select.select_option
                target:
                  entity_id: input_select.music_player
                data:
                  option: Living Room
              card_mod:
                style: |
                  ha-card {
                    --chip-background: {{ 'var(--slate-alpha-55, rgba(142,177,191,0.55))' if is_state('input_select.music_player', 'Living Room') else 'var(--background-color-2)' }};
                    --chip-height: 40px;
