        icon: mdi:speaker-multiple
        card_layout: large
        scrolling_effect: false
        slider_live_update: false
        sub_button:
          - entity: input_number.music_group_volume
            show_state: true
            show_background: false
        modules:
          - mobile_settings_slider
        styles: |
          .bubble-sub-button-1.bubble-sub-button-1 { font-size: 14px !important; font-weight: 700 !important; color: var(--primary-text-color) !important; }
      - type: custom:button-card
        entity: sensor.music_controlled_player
        show_icon: false
        show_name: true
        triggers_update:
          - sensor.music_controlled_player
        tap_action: { action: none }
        name: "[[[ var c = states['sensor.music_controlled_player']; return c ? c.attributes.member_names : ''; ]]]"
        styles:
          card:
            - background: transparent !important
            - --ha-card-background: transparent
            - box-shadow: none
            - transition: none
            - padding: 2px 17px 6px
