title: Music
icon: mdi:music
theme: Dune Mist
path: music
type: custom:grid-layout
cards:
  # Hamburger nav sheet (standalone pop-up; keep as its own top-level card)
  - !include [/config/dashboards/modules/mobile-nav-sheet.yaml, {current: music}]
  - type: custom:button-card
    # grid-layout item: let the card shrink below its content width so wide
    # charts/pop-ups never push the header off narrow screens.
    card_mod:
      style: |
        :host { min-width: 0 !important; }
    styles:
      card:
        - border-radius: 0
        - box-shadow: none
        - background: var(--primary-background-color)
        - padding: 2px 5px 24px 5px
        - margin: 0
        - height: auto
        - box-sizing: border-box
        - max-width: 100%
        - min-width: 0
      grid:
        - grid-template-areas: |
            "header"
            "main"
        - grid-template-columns: minmax(0, 1fr)
        - grid-template-rows: 60px auto
        - row-gap: 0px
        - column-gap: 2px
        - align-items: start
    custom_fields:
      header:
        card:
          type: custom:button-card
          icon: mdi:music
          name: Music
          show_state: false
          show_label: true
          tap_action: { action: none }
          label: |
            [[[
              var rooms = ['media_room','pool','mud_room','gym','living_room','kitchen','office','deck','primary_bedroom','primary_bathroom'];
              var n = 0;
              rooms.forEach(function(r){
                var s = states['media_player.' + r];
                if (s && s.state === 'playing') n++;
              });
              return n > 0 ? ('Playing in ' + n + (n === 1 ? ' room' : ' rooms')) : 'Idle';
            ]]]
          styles:
            card:
              - background: transparent !important
              - --ha-card-background: transparent
              - box-shadow: none
              - transition: none
              - padding: 4px 2px 6px
            grid:
              - grid-template-areas: '"back i n menu" "back i l menu"'
              - grid-template-columns: 24px 40px 1fr 40px
              - grid-template-rows: auto auto
              - align-items: center
              - column-gap: 8px
            img_cell:
              - grid-area: i
              - width: 40px
              - height: 40px
            icon:
              - width: 24px
              - color: var(--primary-text-color)
            name:
              - grid-area: n
              - justify-self: start
              - font-size: 22px
              - font-weight: 700
              - color: var(--primary-text-color)
            label:
              - grid-area: l
              - justify-self: start
              - font-size: 14px
              - color: var(--secondary-text-color)
            custom_fields:
              back:
                - grid-area: back
                - align-self: center
                - justify-self: start
                - margin-left: -8px
              menu:
                - grid-area: menu
                - align-self: center
                - justify-self: end
          custom_fields:
            back:
              card: !include /config/dashboards/modules/mobile-header-back.yaml
            menu:
              card: !include /config/dashboards/modules/mobile-header-hamburger.yaml
      main:
        # The whole Music view body is one custom card: player, speaker chip,
        # transport, group volume, Speakers / Library tiles, Favorites strip and
        # the Speakers, Speaker volumes and Library sheets. Source lives in
        # cards/mobile-music-card (built into www/mobile-music-card/, served at
        # /local/). It reads sensor.music_controlled_player, input_select.music_player,
        # sensor.music_favorites / sensor.music_recent and plays through
        # script.music_play_item. Room names must match input_select.music_player.
        card:
          type: custom:mobile-music-card
          max_volume: 40
          art_max: 320
          rooms:
            - entity: media_player.media_room
              name: Media Room
              icon: mdi:sofa
            - entity: media_player.pool
              name: Pool
              icon: mdi:pool
            - entity: media_player.mud_room
              name: Mud Room
              icon: mdi:coat-rack
            - entity: media_player.gym
              name: Gym
              icon: mdi:dumbbell
            - entity: media_player.living_room
              name: Living Room
              icon: mdi:sofa-outline
            - entity: media_player.kitchen
              name: Kitchen
              icon: mdi:countertop
            - entity: media_player.office
              name: Office
              icon: mdi:desk
            - entity: media_player.deck
              name: Deck
              icon: mdi:table-chair
            - entity: media_player.primary_bedroom
              name: Primary Bedroom
              icon: mdi:bed
            - entity: media_player.primary_bathroom
              name: Primary Bathroom
              icon: mdi:shower
