title: Vacuum
icon: mdi:robot-vacuum
theme: Dune Mist
path: vacuum
type: custom:grid-layout
cards:
  # Hamburger nav sheet (standalone pop-up; keep as its own top-level card)
  - !include [/config/dashboards/modules/mobile-nav-sheet.yaml, {current: vacuum}]
  - type: custom:button-card
    # grid-layout item: let the card shrink below its content width so wide
    # charts/pop-ups never push the header off narrow screens.
    card_mod:
      style: |
        :host { min-width: 0 !important; }
    styles:
      card:
        - border-radius: 0
        - box-shadow: none
        - background: var(--primary-background-color)
        - padding: 2px 5px 24px 5px
        - margin: 0
        - height: auto
        - box-sizing: border-box
        - max-width: 100%
        - min-width: 0
      grid:
        - grid-template-areas: |
            "header"
            "chips"
            "vacuum"
        - grid-template-columns: minmax(0, 1fr)
        - grid-template-rows: 60px auto auto
        - row-gap: 0px
        - column-gap: 2px
        - align-items: start
    custom_fields:
      header:
        card:
          type: custom:button-card
          entity: vacuum.roborock_s8
          icon: mdi:robot-vacuum
          name: Vacuum
          show_state: false
          show_label: true
          tap_action:
            action: none
          label: |
            [[[
              var v = states['vacuum.roborock_s8'];
              var b = states['sensor.roborock_s8_battery'];
              var st = (v && v.state !== 'unknown' && v.state !== 'unavailable')
                ? v.state.charAt(0).toUpperCase() + v.state.slice(1) : 'Unavailable';
              var bat = (b && b.state !== 'unknown' && b.state !== 'unavailable')
                ? ' · ' + Math.round(b.state) + '%' : '';
              return st + bat;
            ]]]
          styles:
            card:
              - background: transparent !important
              - --ha-card-background: transparent
              - box-shadow: none
              - transition: none
              - padding: 4px 2px 6px
            grid:
              - grid-template-areas: '"back i n menu" "back i l menu"'
              - grid-template-columns: 24px 40px 1fr 40px
              - grid-template-rows: auto auto
              - align-items: center
              - column-gap: 8px
            img_cell:
              - grid-area: i
              - width: 40px
              - height: 40px
            icon:
              - width: 24px
              - color: var(--primary-text-color)
            name:
              - grid-area: n
              - justify-self: start
              - font-size: 22px
              - font-weight: 700
              - color: var(--primary-text-color)
            label:
              - grid-area: l
              - justify-self: start
              - font-size: 14px
              - color: var(--secondary-text-color)
            custom_fields:
              back:
                - grid-area: back
                - align-self: center
                - justify-self: start
                - margin-left: -8px
              menu:
                - grid-area: menu
                - align-self: center
                - justify-self: end
          custom_fields:
            back:
              card: !include /config/dashboards/modules/mobile-header-back.yaml
            menu:
              card: !include /config/dashboards/modules/mobile-header-hamburger.yaml
      chips:
        card:
          type: custom:mushroom-chips-card
          card_mod:
            style: |
              ha-card {
                overflow: hidden !important;
                max-width: calc(100vw - 30px) !important; 
                margin-right: 10px !important;
                box-sizing: border-box !important; 
              }
              ha-card > * {
                display: flex !important;
                flex-wrap: nowrap !important;
                overflow-x: auto !important;
                overflow-y: hidden !important;
                gap: 8px !important;
              }
              ha-card > * > * {
                flex-shrink: 0 !important;
              }
              ha-card ::-webkit-scrollbar {
                height: 4px;
              }
              ha-card ::-webkit-scrollbar-track {
                background: transparent;
              }
              ha-card ::-webkit-scrollbar-thumb {
                background: rgba(255, 255, 255, 0.3);
                border-radius: 2px;
              }
              mushroom-chips,
              .chip-container,
              [class*="chip"] {
                display: flex !important;
                flex-wrap: nowrap !important;
                overflow-x: auto !important;
                overflow-y: hidden !important;
              }
              mushroom-chip,
              [class*="chip"]:not([class*="container"]) {
                flex-shrink: 0 !important;
                white-space: nowrap !important;
              }
          chips:
            - type: template
              content: Back
              tap_action:
                action: navigate
                navigation_path: /mobile-dash/mobile-home
              icon: mdi:chevron-left
              card_mod:
                style: |
                  :host {
                    zoom: 1.25 !important;
                    --chip-background: var(--background-color-2);
                  }
            - type: entity
              entity: sensor.roborock_s8_battery
              icon: mdi:battery
              icon_color: amber
              tap_action:
                action: more-info
              card_mod:
                style: |
                  ha-card { zoom: 1.25 !important;
                  --chip-background: var(--background-color-2);
                  }                     
            - type: entity
              entity: sensor.roborock_s8_cleaning_progress
              icon: mdi:robot-vacuum
              icon_color: light-blue
              tap_action:
                action: more-info
              card_mod:
                style: |
                  ha-card { zoom: 1.25 !important; 
                  --chip-background: var(--background-color-2);
                  }
      vacuum:
        card:
          type: vertical-stack
          cards:
            - type: custom:bubble-card
              card_type: separator
              name: Vacuum
              icon: mdi:menu-open
              rows: 0.75
              modules:
                - mobile_separator
            - type: custom:bubble-card
              card_type: button
              button_type: switch
              entity: vacuum.roborock_s8
              scrolling_effect: false
              show_state: true
              show_attribute: true
              attribute: battery_level
              sub_button:
                - entity: vacuum.roborock_s8
                  show_attribute: false
                  state_background: false
                  show_icon: false
              styles: |
                .bubble-name {
                  font-size: 16px !important;
                  }
              modules:
                - mobile_settings_module
            - type: custom:bubble-card
              name: Suction Level
              icon: mdi:fan
              card_type: button
              card_layout: large
              button_type: state
              entity: input_select.vacuum_suction_mode
              show_state: false
              sub_button:
                - entity: input_select.vacuum_suction_mode
                  show_background: true
                  show_attribute: false
                  show_state: true
                  show_icon: false                   
              styles: |
                .bubble-name {
                  font-size: 16px !important;
                  }
              modules:
                - mobile_settings_module
            - type: custom:bubble-card
              name: Mop Intensity
              icon: mdi:water
              card_type: button
              card_layout: large
              button_type: state
              entity: select.roborock_s8_mop_intensity
              show_state: false
              sub_button:
                - entity: select.roborock_s8_mop_intensity
                  show_background: true
                  show_attribute: false
                  show_state: true
                  show_icon: false                   
              styles: |
                .bubble-name {
                  font-size: 16px !important;
                  }
              modules:
                - mobile_settings_module
            - type: custom:bubble-card
              name: Mop Mode
              icon: mdi:heating-coil
              card_type: button
              card_layout: large
              button_type: state
              entity: select.roborock_s8_mop_mode
              show_state: false
              sub_button:
                - entity: select.roborock_s8_mop_mode
                  show_background: true
                  show_attribute: false
                  show_state: true
                  show_icon: false                   
              styles: |
                .bubble-name {
                  font-size: 16px !important;
                  }
              modules:
                - mobile_settings_module
            - type: custom:bubble-card
              card_type: button
              card_layout: large
              button_type: state
              entity: script.1750692869441
              show_state: false
              icon: mdi:play
              tap_action:
                action: perform-action
                perform_action: script.1750692869441
                target: {}
              button_action:
                tap_action:
                  action: perform-action
                  perform_action: script.1750692869441
                  target: {}
              styles: |
                .bubble-name {
                  font-size: 16px !important;
                  }
              modules:
                - mobile_settings_module
            - type: custom:bubble-card
              card_type: separator
              name: Basement
              icon: mdi:menu-open
              rows: 0.75
              modules:
                - mobile_separator
            - type: entities
              entities:
                - entity: input_boolean.vacuum_mudroom
                  name: Mudroom
                - entity: input_boolean.vacuum_basement_bathroom
                  name: Bathroom
                - entity: input_boolean.vacuum_gym
                  name: Gym
                - entity: input_boolean.vacuum_media_room
                  name: Media Room
                - entity: input_boolean.vacuum_basement_hallway
                  name: Hallway
              state_color: true
              card_mod:
                style: |
                  ha-card {
                    font-size: 16px;
                    font-weight: bold;
                    background: var(--background-color-2);
                    border-radius: 15px;
                    }
            - type: custom:bubble-card
              card_type: separator
              name: First Floor
              icon: mdi:menu-open
              rows: 0.75
              modules:
                - mobile_separator
            - type: entities
              entities:
                - entity: input_boolean.vacuum_kitchen
                  name: Kitchen
                - entity: input_boolean.vacuum_living_room
                  name: Living Room
                - entity: input_boolean.vacuum_first_floor_bathroom
                  name: Bathroom
                - entity: input_boolean.vacuum_dining_room
                  name: Dining Room
                - entity: input_boolean.vacuum_entry
                  name: Entry
              state_color: true
              card_mod:
                style: |
                  ha-card {
                    font-size: 16px;
                    font-weight: bold;
                    background: var(--background-color-2);
                    border-radius: 15px;
                    }
            - type: custom:bubble-card
              card_type: separator
              name: Second Floor
              icon: mdi:menu-open
              rows: 0.75
              modules:
                - mobile_separator
            - type: entities
              entities:
                - entity: input_boolean.vacuum_second_floor_hallway
                  name: Hallway
                - entity: input_boolean.vacuum_guest_bathroom
                  name: Guest Bathroom
                - entity: input_boolean.vacuum_office
                  name: Office
                - entity: input_boolean.vacuum_front_guest_bedroom
                  name: Front Guest Bedroom
                - entity: input_boolean.vacuum_back_guest_bedroom
                  name: Back Guest Bedroom
                - entity: input_boolean.vacuum_primary_bedroom
                  name: Primary Bedroom
                - entity: input_boolean.vacuum_primary_bathroom
                  name: Primary Bathroom
              state_color: true
              card_mod:
                style: |
                  ha-card {
                    font-size: 16px;
                    font-weight: bold;
                    background: var(--background-color-2);
                    border-radius: 15px;
                    }