# lovelace_gen
# Music view · Speaker volumes sheet row: one Bubble slider per Sonos room,
# capped at the dashboard's 40 %. Bubble's own value readout shows the level.
# Rendered only while the room is in the controlled speaker's group (the
# styles block is the one place Bubble evaluates JS). Vars: name, entity, icon
type: custom:bubble-card
card_type: button
button_type: slider
entity: {{ entity }}
name: {{ name }}
icon: {{ icon }}
card_layout: large
scrolling_effect: false
min_value: 0
max_value: 40
step: 1
slider_live_update: false
modules:
  - mobile_settings_slider
styles: |
  ${(() => {
    const c = hass.states['sensor.music_controlled_player'];
    const g = (c && c.attributes.group_members) || [c && c.state];
    return g.includes('{{ entity }}') ? '' : 'ha-card { display: none !important; }';
  })()}
  .bubble-range-value.bubble-range-value {
    display: block !important; font-size: 14px !important; font-weight: 700 !important;
    color: var(--primary-text-color) !important; margin-right: 12px !important;
  }
