# lovelace_gen
# Wall panel shade card: no slider - the 50px icon carries state (open /
# partial / closed glyph + color), three 84px circle buttons carry control
# (up / stop / down). Geometry and the icon state table come from the
# wall-panel handoff; entities and service calls follow the repo's shade
# group cards.
# Required vars: shade_entity, shade_name
- type: custom:bubble-card
  card_type: button
  button_type: name
  entity: {{ shade_entity }}
  name: {{ shade_name }}
  icon: >-
    ${(() => {
      const p = hass.states['{{ shade_entity }}']?.attributes?.current_position;
      if (p === undefined) return state === 'open' ? 'mdi:roller-shade' : 'mdi:roller-shade-closed';
      if (p >= 98) return 'mdi:roller-shade';
      if (p > 0) return 'mdi:blinds-horizontal';
      return 'mdi:roller-shade-closed';
    })()}
  show_state: true
  show_attribute: true
  attribute: current_position
  scrolling_effect: false
  card_layout: large
  tap_action:
    action: none
  sub_button:
    - entity: {{ shade_entity }}
      icon: mdi:arrow-up
      show_state: false
      state_background: false
      show_background: false
      tap_action:
        action: perform-action
        perform_action: cover.open_cover
        target:
          entity_id: {{ shade_entity }}
    - entity: {{ shade_entity }}
      icon: mdi:stop
      show_state: false
      state_background: false
      show_background: false
      tap_action:
        action: perform-action
        perform_action: cover.stop_cover
        target:
          entity_id: {{ shade_entity }}
    - entity: {{ shade_entity }}
      icon: mdi:arrow-down
      show_state: false
      state_background: false
      show_background: false
      tap_action:
        action: perform-action
        perform_action: cover.close_cover
        target:
          entity_id: {{ shade_entity }}
  rows: 1
  modules:
    - wall_panel_shades
