# lovelace_gen
# Wall panel fixed footer nav (100px, icons only). Six views; the Alarm view
# is deliberately NOT here - it is reached from the header shield and the
# notification pill (6 items is the comfortable max at 720px).
# Required var: current  (home | shades | lights | climate | music | settings)
# Each column is 120x100; the pill is 92x64 with a 46px icon - above the
# 99px primary touch target from the handoff's device constraints.
{% set items = [
  ('home',     'mdi:home'),
  ('shades',   'mdi:roller-shade'),
  ('lights',   'mdi:lightbulb'),
  ('climate',  'mdi:fan'),
  ('music',    'mdi:music'),
  ('settings', 'mdi:cog'),
] %}
type: custom:button-card
show_icon: false
show_name: false
show_state: false
tap_action:
  action: none
styles:
  card:
    - position: fixed
    - bottom: 0px
    - left: 0px
    - right: 0px
    - width: auto
    - height: 100px
    - margin: 0
    - padding: 0
    - z-index: 20
    - border-radius: 0px
    - box-shadow: none
    - transition: none
    - background: var(--secondary-background-color)
    - border-top: 1px solid rgba(255,255,255,0.08)
  grid:
    - grid-template-areas: '"{{ items | map(attribute=0) | join(' ') }}"'
    - grid-template-columns: repeat(6, 1fr)
    - grid-template-rows: 100px
    - align-items: center
    - justify-items: center
    - column-gap: 0px
  custom_fields:
{% for key, icon in items %}
    {{ key }}:
      - grid-area: {{ key }}
      - align-self: center
      - justify-self: center
{% endfor %}
custom_fields:
{% for key, icon in items %}
  {{ key }}:
    card:
      type: custom:button-card
      show_icon: true
      show_name: false
      icon: {{ icon }}
      tap_action:
        action: navigate
        navigation_path: /wall-panel-dash/{{ key }}
      styles:
        card:
          - width: 92px
          - height: 64px
          - border-radius: 999px
          - box-shadow: none
          - transition: none
          - --ha-card-background: transparent
          - background: {{ 'var(--accent-color)' if current == key else 'transparent' }} !important
        icon:
          - width: 46px
          - height: 46px
          - color: {{ 'var(--primary-background-color)' if current == key else 'var(--secondary-text-color)' }}
{% endfor %}
