# lovelace_gen
# Settings toggle row (v2.7 mobile): icon · name · On/Off text · CSS switch.
# Rows sit inside a wrapper vertical-stack (card_mod :host padding 0 12px), so
# the row itself only carries 11px 2px padding and a hairline top divider.
# Reads state via states[...] so it can't throw regardless of nesting.
# Required vars: entity, name, icon
# Optional vars:
#   on_label / off_label  state text (default On / Off)
#   on_color              switch track colour while on (default var(--slate-alpha-55, rgba(142,177,191,0.55)));
#                         destructive toggles pass var(--error-alpha-65, rgba(224,105,91,0.65))
#   confirm               confirmation text shown before the toggle fires
type: custom:button-card
entity: {{ entity }}
name: {{ name }}
show_state: true
show_label: false
show_icon: true
icon: {{ icon }}
tap_action:
  action: toggle
{% if confirm is defined %}
  confirmation:
    text: {{ confirm }}
{% endif %}
state_display: |
  [[[ return (states['{{ entity }}'] || {}).state === 'on' ? '{{ on_label | default('On') }}' : '{{ off_label | default('Off') }}'; ]]]
styles:
  card:
  - background: transparent !important
  - --ha-card-background: transparent
  - box-shadow: none
  - border-radius: 0
  - border-top: 1px solid var(--row-divider-color, rgba(255,255,255,0.06))
  - padding: 11px 2px
  - transition: none
  - cursor: pointer
  grid:
  - grid-template-areas: '"ic n st sw"'
  - grid-template-columns: auto 1fr auto auto
  - grid-template-rows: 1fr
  - align-items: center
  - column-gap: 10px
  img_cell:
  - grid-area: ic
  - width: 22px
  - height: 22px
  icon:
  - width: 18px
  - color: var(--primary-text-color)
  name:
  - grid-area: n
  - justify-self: start
  - font-size: 16px
  - font-weight: 600
  - color: var(--primary-text-color)
  - align-self: center
  - line-height: 22px
  state:
  - grid-area: st
  - justify-self: end
  - font-size: 14px
  - font-weight: 600
  - color: |
      [[[ return (states['{{ entity }}'] || {}).state === 'on' ? 'var(--slate-bright)' : 'var(--secondary-text-color)'; ]]]
  - align-self: center
  - line-height: 22px
  custom_fields:
    sw:
    - grid-area: sw
    - justify-self: end
    - align-self: center
custom_fields:
  sw: |-
    [[[
      var on = (states['{{ entity }}'] || {}).state === 'on';
      return '<div style="width:38px;height:22px;border-radius:999px;background:'
        + (on ? '{{ on_color | default('var(--slate-alpha-55, rgba(142,177,191,0.55))') }}' : 'var(--switch-unchecked-track-color)')
        + ';position:relative;transition:background .2s ease;">'
        + '<div style="position:absolute;top:2px;left:' + (on ? '18px' : '2px')
        + ';width:18px;height:18px;border-radius:50%;background:var(--toggle-knob-color, #ffffff);'
        + 'box-shadow:0 1px 2px rgba(0, 0, 0, 0.25);transition:left .2s ease;"></div></div>';
    ]]]
