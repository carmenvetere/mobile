# Wall panel Home - adaptive status layout. Scenes on top (2-column grid
# from the shared dynamic-scenes module); the lower half adapts to alarm
# state: Now Playing while disarmed, the disarm control while armed/arming.
title: Home
icon: mdi:home
theme: Dune Mist
path: home
type: custom:grid-layout
cards:
  - type: custom:button-card
    styles:
      card:
        - border-radius: 0px
        - box-shadow: none
        - padding: 0px 34px 134px
        - margin: 0
        - height: auto
        - background: var(--primary-background-color)
      grid:
        - grid-template-areas: |
            "header"
            "main"
        - grid-template-columns: auto
        - grid-template-rows: 110px auto
        - row-gap: 4px
        - align-items: start
    custom_fields:
      header:
        card: !include /config/dashboards/modules/wall-panel-header.yaml
      main:
        card:
          type: vertical-stack
          cards:
            - type: custom:bubble-card
              card_type: separator
              name: Scenes
              icon: mdi:lamps
              rows: 0.75
              modules:
                - wall_panel_separator
            - !include
                - /config/dashboards/modules/dynamic-scenes.yaml
                - module_name: wall_panel_scenes
                  dashboard: basement_wall_panel
            # --- Adaptive lower half: Now Playing while disarmed ---
            - type: conditional
              conditions:
                - condition: state
                  entity: alarm_control_panel.alarmo
                  state: disarmed
              card:
                type: vertical-stack
                cards:
                  - type: custom:bubble-card
                    card_type: separator
                    name: Now Playing
                    icon: mdi:music
                    rows: 0.75
                    sub_button:
                      - entity: media_player.media_room
                        name: Basement Sonos
                        show_name: true
                        show_state: false
                        show_icon: false
                        show_background: false
                    modules:
                      - wall_panel_separator
                  - type: custom:bubble-card
                    card_type: media-player
                    entity: media_player.media_room
                    card_layout: large-2-rows
                    hide:
                      power_button: true
                    min_volume: 0
                    max_volume: 40
                    scrolling_effect: false
                    modules:
                      - wall_panel_media
            # --- Adaptive lower half: disarm control while armed/arming ---
            # (The handoff's PIN keypad is intentionally replaced by the
            # repo's codeless Alarmo segmented control - see
            # wall-panel-alarm-control.yaml. Working + Cleaning scenes hide
            # while armed so this section fits without overflow.)
            - type: conditional
              conditions:
                - condition: state
                  entity: alarm_control_panel.alarmo
                  state_not: disarmed
              card:
                type: vertical-stack
                cards:
                  - type: custom:bubble-card
                    card_type: separator
                    name: Alarm
                    icon: mdi:shield-lock
                    rows: 0.75
                    sub_button:
                      - entity: alarm_control_panel.alarmo
                        show_state: true
                        show_icon: false
                        show_background: false
                    styles: |
                      .bubble-icon {
                        color: var(--gold-color) !important;
                      }
                      .bubble-sub-button {
                        color: var(--gold-color) !important;
                      }
                    modules:
                      - wall_panel_separator
                  - !include /config/dashboards/modules/wall-panel-alarm-control.yaml
  - !include
      - /config/dashboards/modules/wall-panel-nav-menu.yaml
      - current: home
