# Wall panel Climate - Basement zone only. Thermostat card reuses the
# shared mobile-climate-row (same entity + service calls as mobile) with
# wall-panel sizing from the wall_panel_climate bubble module; toggle rows
# use the wall-panel toggle-row module.
title: Climate
icon: mdi:fan
theme: Dune Mist
path: climate
type: custom:grid-layout
cards:
  - type: custom:button-card
    styles:
      card:
        - border-radius: 0px
        - box-shadow: none
        - padding: 0px 34px 134px
        - margin: 0
        - height: auto
        - background: var(--primary-background-color)
      grid:
        - grid-template-areas: |
            "header"
            "main"
        - grid-template-columns: auto
        - grid-template-rows: 110px auto
        - row-gap: 4px
        - align-items: start
    custom_fields:
      header:
        card: !include /config/dashboards/modules/wall-panel-header.yaml
      main:
        card:
          type: vertical-stack
          cards:
            - type: custom:bubble-card
              card_type: separator
              name: Basement
              icon: mdi:fan
              rows: 0.75
              sub_button:
                - entity: sensor.basement_thermostat_homekit_current_temperature
                  show_state: true
                  show_icon: false
                  show_background: false
              styles: |
                .bubble-sub-button {
                  color: var(--slate-bright) !important;
                }
              modules:
                - wall_panel_separator
            - !include
                - /config/dashboards/modules/mobile-climate-row.yaml
                - climate_entity: climate.basement_thermostat
                  thermostat_name: Basement Thermostat
                  module_name: wall_panel_climate
            - !include
                - /config/dashboards/modules/wall-panel-toggle-row.yaml
                - toggle_entity: switch.basement_thermostat_family_room_priority
                  row_name: Media Room Priority
                  row_icon: mdi:star-outline
                  temp_sensor: sensor.family_room_air_sensor_01_temperature_sensor
                  humidity_sensor: sensor.family_room_air_sensor_01_humidity_sensor
            - !include
                - /config/dashboards/modules/wall-panel-toggle-row.yaml
                - toggle_entity: switch.basement_thermostat_basement_priority
                  row_name: Basement Hallway Priority
                  row_icon: mdi:star-outline
                  temp_sensor: sensor.basement_thermostat_homekit_current_temperature
                  humidity_sensor: sensor.basement_thermostat_homekit_current_humidity
            - !include
                - /config/dashboards/modules/wall-panel-toggle-row.yaml
                - toggle_entity: switch.utility_room_ventilation_damper
                  row_name: Ventilation
                  row_icon: mdi:air-filter
            - !include
                - /config/dashboards/modules/wall-panel-toggle-row.yaml
                - toggle_entity: switch.basement_bathroom_exhaust_fan
                  row_name: Basement Bathroom Exhaust Fan
                  row_icon: mdi:fan
  - !include
      - /config/dashboards/modules/wall-panel-nav-menu.yaml
      - current: climate
