# Wall panel Music - full-screen Sonos player. Same custom
# wall-panel-sonos-card as mobile (layout: wall); room chips trimmed to the
# handoff's six basement-reachable rooms and favorites to its six picks.
title: Music
icon: mdi:music
theme: Dune Mist
path: music
type: custom:grid-layout
cards:
  - type: custom:button-card
    styles:
      card:
        - border-radius: 0px
        - box-shadow: none
        - padding: 0px 34px 134px
        - margin: 0
        - height: auto
        - background: var(--primary-background-color)
      grid:
        - grid-template-areas: |
            "header"
            "main"
        - grid-template-columns: auto
        - grid-template-rows: 110px auto
        - row-gap: 4px
        - align-items: start
    custom_fields:
      header:
        card: !include /config/dashboards/modules/wall-panel-header.yaml
      main:
        card:
          type: custom:wall-panel-sonos-card
          entities:
            - media_player.media_room
            - media_player.gym
            - media_player.mud_room
            - media_player.living_room
            - media_player.kitchen
            - media_player.pool
          default_view: player
          max_volume: 40
          layout: wall
          favorites:
            - id: ms_now
              name: MS NOW
              type: station
              media_content_id: >-
                x-sonosapi-hls:channel-linear%3a95bffee3-e903-ca28-6332-1b94f41a8962?sid=37&flags=8200&sn=5
              media_content_type: music
              art: "linear-gradient(135deg, #c8102e 0%, #1a1c1f 100%)"
            - id: pool_2026
              name: Pool Mix - 2026
              type: playlist
              media_content_id: x-sonos-spotify:playlist:0KkRPLBW2cciKaSkNIdyO3?sid=9812d3d5f8854188
              media_content_type: playlist
              art: "linear-gradient(135deg, #00b3a4 0%, #f4d35e 100%)"
            - id: hotel_costes_radio
              name: Hotel Costes Radio
              type: playlist
              media_content_id: x-sonos-spotify:playlist:37i9dQZF1E4mWbHqaowOUP?sid=12&flags=8232&sn=9
              media_content_type: playlist
              art: "linear-gradient(135deg, #1a1a1a 0%, #6a4a2c 100%)"
            - id: chill_mix
              name: Chill Mix
              type: playlist
              media_content_id: x-sonos-spotify:playlist:37i9dQZF1EVHGWrwldPRtj?sid=12&flags=8232&sn=9
              media_content_type: playlist
              art: "linear-gradient(135deg, #2a3540 0%, #6a4ec8 100%)"
            - id: pop_dance_mix
              name: Pop & Dance Mix
              type: station
              media_content_id: >-
                x-sonosapi-hls-static:channel-xtra%3adc93524a-aa6d-b0c4-0d53-caabac97500c%3a15ebc9ab-82ba-0dd1-0276-d408113397df?sid=37&flags=32768&sn=5
              media_content_type: music
              art: "linear-gradient(135deg, #ff006e 0%, #8338ec 100%)"
            - id: ella_and_louis
              name: The Best of Ella & Louis
              type: playlist
              media_content_id: x-sonos-spotify:playlist:502ADPBCxITjzQZOlnAjQQ?sid=12&flags=8232&sn=9
              media_content_type: playlist
              art: "linear-gradient(135deg, #3d2914 0%, #d4a574 100%)"
          favorites_source: config
  - !include
      - /config/dashboards/modules/wall-panel-nav-menu.yaml
      - current: music
