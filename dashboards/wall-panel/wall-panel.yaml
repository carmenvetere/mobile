# lovelace_gen
# Basement wall panel dashboard - Raspberry Pi Touch Display 2, 720x1280
# portrait, kiosk. Companion to the mobile dashboard: same Dune Mist theme,
# same entity rosters (shared modules under dashboards/modules/), wall-panel
# sizing via bubble_card/modules/wall_panel_*.yaml.
kiosk_mode:
  non_admin_settings:
    hide_header: true
    hide_sidebar: true
    hide_search: true
    hide_assistant: true
  mobile_settings:
    hide_header: true
    hide_search: true
    hide_sidebar: true
    hide_overflow: true
views:
  - !include home-view.yaml
  - !include shades-view.yaml
  - !include lights-view.yaml
  - !include climate-view.yaml
  - !include music-view.yaml
  - !include settings-view.yaml
  - !include alarm-view.yaml
