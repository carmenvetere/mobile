# Wall panel Alarm - state line + Alarmo segmented control. Reached from
# the header shield and the notification pill; deliberately not in the
# footer nav (6 items is the comfortable max at this width).
#
# The handoff's code dots + PIN keypad are intentionally omitted: the
# repo's Alarmo disarm is a codeless service call (see mobile
# security-view.yaml), so a keypad would be non-functional theater. If a
# disarm code is enabled in Alarmo later, add the keypad here and on the
# Home view's armed state.
title: Alarm
icon: mdi:shield-home
theme: Dune Mist
path: alarm
type: custom:grid-layout
cards:
  - type: custom:button-card
    styles:
      card:
        - border-radius: 0px
        - box-shadow: none
        - padding: 0px 34px 134px
        - margin: 0
        - height: auto
        - background: var(--primary-background-color)
      grid:
        - grid-template-areas: |
            "header"
            "main"
        - grid-template-columns: auto
        - grid-template-rows: 110px auto
        - row-gap: 4px
        - align-items: start
    custom_fields:
      header:
        card: !include /config/dashboards/modules/wall-panel-header.yaml
      main:
        card:
          type: vertical-stack
          cards:
            # --- State line: 40px shield + 32px/700 text, both state-colored ---
            - type: custom:button-card
              entity: alarm_control_panel.alarmo
              show_icon: true
              show_name: false
              show_state: true
              show_label: true
              tap_action:
                action: none
              icon: |
                [[[ var a = states['alarm_control_panel.alarmo'];
                    var s = a ? a.state : 'disarmed';
                    return s === 'disarmed' ? 'mdi:shield-off-outline'
                      : (s === 'triggered' ? 'mdi:shield-alert' : 'mdi:shield-lock'); ]]]
              state_display: |
                [[[
                  var e = states['alarm_control_panel.alarmo'];
                  var s = e ? e.state : 'unknown';
                  var m = {disarmed:'Disarmed', armed_home:'Armed Home',
                    armed_away:'Armed Away', armed_night:'Armed Night',
                    arming:'Arming…', pending:'Pending', triggered:'Triggered'};
                  return m[s] || s;
                ]]]
              label: |
                [[[
                  var doors = [
                    ['binary_sensor.front_door','Front Door'],
                    ['binary_sensor.kitchen_french_doors','Kitchen French Doors'],
                    ['binary_sensor.living_room_french_doors','Living Room French Doors'],
                    ['binary_sensor.mudroom_entry_door','Mudroom Door'],
                    ['binary_sensor.mudroom_garage_door','Garage Entry'],
                    ['cover.garage_door_garage','Garage Door']
                  ];
                  var open = doors.filter(function(d){
                    var e = states[d[0]];
                    return e && (e.state === 'on' || e.state === 'open');
                  }).map(function(d){ return d[1]; });
                  return open.length ? open.join(', ') + ' open' : 'All Doors Closed';
                ]]]
              styles:
                card:
                  - background: transparent !important
                  - --ha-card-background: transparent
                  - box-shadow: none
                  - transition: none
                  - padding: 18px 0 22px
                grid:
                  - grid-template-areas: |
                      "i st"
                      "l l"
                  - grid-template-columns: auto auto
                  - justify-content: center
                  - align-items: center
                  - column-gap: 14px
                  - row-gap: 12px
                img_cell:
                  - grid-area: i
                  - width: 44px
                  - height: 44px
                icon:
                  - width: 40px
                  - color: &alarm_state_color |
                      [[[ var a = states['alarm_control_panel.alarmo'];
                          var s = a ? a.state : 'disarmed';
                          if (s === 'disarmed') return 'var(--sage-color)';
                          if (s === 'arming' || s === 'pending') return 'var(--amber-color)';
                          if (s === 'triggered') return 'var(--error-color)';
                          return 'var(--gold-color)'; ]]]
                state:
                  - grid-area: st
                  - font-size: 32px
                  - font-weight: 700
                  - color: *alarm_state_color
                label:
                  - grid-area: l
                  - justify-self: center
                  - font-size: 20px
                  - font-weight: 600
                  - color: var(--secondary-text-color)
            # --- Alarmo segmented control (Armed Away · Armed Home · Disarmed) ---
            - !include /config/dashboards/modules/wall-panel-alarm-control.yaml
  - !include
      - /config/dashboards/modules/wall-panel-nav-menu.yaml
      - current: alarm
