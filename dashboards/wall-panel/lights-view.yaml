# Wall panel Lights - Basement + Outdoor rosters from the shared modules
# (single source of truth with mobile; the modules emit their own
# wall-panel separators when dashboard contains 'wall_panel').
title: Lights
icon: mdi:lightbulb
theme: Dune Mist
path: lights
type: custom:grid-layout
cards:
  - type: custom:button-card
    styles:
      card:
        - border-radius: 0px
        - box-shadow: none
        - padding: 0px 34px 134px
        - margin: 0
        - height: auto
        - background: var(--primary-background-color)
      grid:
        - grid-template-areas: |
            "header"
            "main"
        - grid-template-columns: auto
        - grid-template-rows: 110px auto
        - row-gap: 4px
        - align-items: start
    custom_fields:
      header:
        card: !include /config/dashboards/modules/wall-panel-header.yaml
      main:
        card:
          type: vertical-stack
          cards:
            - type: vertical-stack
              cards: !include [/config/dashboards/modules/basement-lights-individual.yaml, {module_name: wall_panel_lights, dashboard: basement_wall_panel}]
            - type: vertical-stack
              cards: !include [/config/dashboards/modules/outdoor-lights-individual.yaml, {module_name: wall_panel_lights, dashboard: basement_wall_panel}]
  - !include
      - /config/dashboards/modules/wall-panel-nav-menu.yaml
      - current: lights
