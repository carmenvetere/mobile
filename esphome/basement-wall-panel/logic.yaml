  # ================================================================ music page
  - id: render_music
    then:
      - lambda: |-
          using namespace panel;
          panel::state().players = parse_players(id(ts_players).state);
          size_t n; auto *S = speakers(n);
          // active player: focused (if playing) → first playing in priority order → media room
          std::string active;
          const Player *fp = find_player(panel::state().players, id(g_focus));
          if (fp && fp->playing()) active = id(g_focus);
          if (active.empty()) for (size_t i = 0; i < n; i++) { const Player *p = find_player(panel::state().players, S[i].id); if (p && p->playing()) { active = S[i].id; break; } }
          if (active.empty()) active = S[0].id;
          id(g_active) = active;
          const Player *ap = find_player(panel::state().players, active);
          std::vector<std::string> grouped;
          if (ap) for (auto &m : ap->members) grouped.push_back(m);
          bool contains = false; for (auto &m : grouped) if (m == active) contains = true;
          if (!contains) grouped = {active};
          id(g_grouped) = grouped;
          // now playing
          bool has = ap && valid(ap->title) && !ap->title.empty();
          text(id(np_title), has ? ap->title : "Nothing playing");
          text(id(np_artist), has ? ap->artist : "");
          text(id(np_spk_name), grouped.size() > 1 ? speaker_name(active) + " + " + std::to_string(grouped.size() - 1) : speaker_name(active));
          text(id(np_spk_icon), grouped.size() > 1 ? utf8(0xF0D38) : speaker_icon(active));
          text(id(np_play_icon), ap && ap->playing() ? utf8(0xF03E4) : utf8(0xF040A));
          int sum = 0, cnt = 0;
          for (auto &m : grouped) { const Player *p = find_player(panel::state().players, m); if (p) { sum += p->volume; cnt++; } }
          int avg = cnt ? sum / cnt : 0;
          lv_slider_set_value(id(np_volume), avg, LV_ANIM_ON);
          text(id(np_vol_pct), std::to_string(avg) + "%");
          // album art
          std::string pic = ap ? ap->picture : "";
          if (pic != id(g_art_url)) {
            id(g_art_url) = pic;
            if (pic.empty()) { show(id(np_art_img), false); show(id(np_art_icon), true); }
            else {
              std::string url = pic.rfind("http", 0) == 0 ? pic : std::string("${ha_base_url}") + pic;
              id(album_art).set_url(url.c_str());
              id(album_art).update();
            }
          }
          id(render_group).execute();
          id(render_vols).execute();

  - id: music_cmd
    mode: queued
    parameters:
