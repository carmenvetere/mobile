  - id: render_climate
    then:
      - lambda: |-
          using namespace panel;
          auto d = [](float v) { return std::isnan(v) ? std::string("—") : deg(v); };
          text(id(val_fa_lr), d(id(s_fa_lr).state));
          text(id(val_fa_bs), d(id(s_fa_bs).state));
          text(id(val_co2_ceiling), std::isnan(id(s_co2_ceiling).state) ? "—" : fmt_int("%d ppm", (int) lroundf(id(s_co2_ceiling).state)));
          text(id(val_co2_recover), std::isnan(id(s_co2_recover).state) ? "—" : fmt_int("%d ppm", (int) lroundf(id(s_co2_recover).state)));
          text(id(val_vent_range), std::isnan(id(s_vent_min).state) || std::isnan(id(s_vent_max).state) ? "—" : fmt_int("%d", (int) lroundf(id(s_vent_min).state)) + "–" + deg(id(s_vent_max).state));
          text(id(val_freecool), d(id(s_freecool).state));
          text(id(val_minvent), std::isnan(id(s_minvent).state) ? "—" : fmt_int("%d min", (int) lroundf(id(s_minvent).state)));
          text(id(val_away_heat), d(id(s_away_heat).state));
          text(id(val_away_cool), d(id(s_away_cool).state));

  - id: render_energy_sheet
    then:
      - lambda: |-
          using namespace panel;
          auto k = [](float v) { return std::isnan(v) ? std::string("—") : fmt("%.1f kWh", v); };
          text(id(val_e_well), k(id(s_e_well).state));
          text(id(val_e_pool), k(id(s_e_pool).state));
          text(id(val_e_ev), k(id(s_e_ev).state));

  - id: render_maint
    then:
      - lambda: |-
          using namespace panel;
          auto now = id(ha_time).now();
          struct Row { lv_obj_t *name, *val, *btn, *lbl; };
          Row rows[4] = {{id(mname_upper), id(mval_upper), id(mbtn_upper), id(mbtn_lbl_upper)},
                         {id(mname_lower), id(mval_lower), id(mbtn_lower), id(mbtn_lbl_lower)},
                         {id(mname_wh), id(mval_wh), id(mbtn_wh), id(mbtn_lbl_wh)},
                         {id(mname_dryer), id(mval_dryer), id(mbtn_dryer), id(mbtn_lbl_dryer)}};
          std::string vals[4]; uint32_t cols[4]; bool due[4];
          float up = id(s_upper_filter).state, lo = id(s_lower_filter).state;
          auto hours = [](float h, std::string &v, uint32_t &c, bool &d) {
            if (std::isnan(h)) { v = "—"; c = TEXT3; d = false; return; }
            v = thousands((long) lroundf(h)) + " h";
            c = h < 1800 ? SAGE : h <= 2000 ? GOLD : RED; d = h > 2000;
          };
          hours(up, vals[0], cols[0], due[0]);
          hours(lo, vals[1], cols[1], due[1]);
          auto months = [&](const std::string &ymd, float warn, float over, std::string &v, uint32_t &c, bool &d) {
            if (!valid(ymd)) { v = "—"; c = TEXT3; d = false; return; }
            float m = months_since(ymd, now);
            v = short_date(ymd);
            c = m < warn ? SAGE : m <= over ? GOLD : RED; d = m > over;
          };
          months(id(ts_wh_flushed).state, 5, 6, vals[2], cols[2], due[2]);
          months(id(ts_dryer_cleaned).state, 11, 12, vals[3], cols[3], due[3]);
          std::string worst;
          for (int i = 0; i < 4; i++) {
            text(rows[i].val, vals[i]); text_color(rows[i].val, cols[i]);
            text_color(rows[i].name, due[i] ? AMBER : TEXT);
            border(rows[i].btn, due[i] ? AMBER : HAIRLINE);
            text_color(rows[i].lbl, due[i] ? AMBER : TEXT2);
          }
          if (due[0]) worst = "Upper filter " + vals[0];
          else if (due[1]) worst = "Lower filter " + vals[1];
          else if (due[2]) worst = "Water heater " + vals[2];
          else if (due[3]) worst = "Dryer vent " + vals[3];
          else if (cols[0] == GOLD) worst = "Upper filter " + vals[0];
          else if (cols[1] == GOLD) worst = "Lower filter " + vals[1];
          bool any = !worst.empty();
          text(id(hub_val_maint), any ? worst : "All good");
          text_color(id(hub_val_maint), any ? AMBER : TEXT3);
          text_color(id(hub_icon_maint), any ? AMBER : SLATE);

  - id: maint_reset
    mode: queued
    parameters:
      which: std::string
    then:
      - if:
          condition:
            lambda: "return which == \"upper\";"
          then:
            - homeassistant.action: { action: script.reset_upper_floors_filter_runtime }
      - if:
          condition:
            lambda: "return which == \"lower\";"
          then:
            - homeassistant.action: { action: script.reset_lower_floors_filter_runtime }
      - if:
          condition:
            lambda: "return which == \"wh\";"
          then:
            - homeassistant.action: { action: script.reset_hot_water_last_flushed_date }
      - if:
          condition:
            lambda: "return which == \"dryer\";"
          then:
            - homeassistant.action: { action: script.reset_dryer_vent_last_cleaned_date }

  # ================================================================ weather sheet
  - id: render_weather
    then:
      - lambda: |-
          using namespace panel;
          // now: temp|condition|feels|hi|lo
          auto f = split(id(ts_wx_now).state, '|');
          if (valid(id(ts_wx_now).state) && f.size() >= 5) {
            text(id(wx_hdr_icon), wx_icon(f[1]));
            text(id(wx_temp), deg(to_f(f[0])));
            text(id(wx_sub), wx_text(f[1]) + " · feels " + deg(to_f(f[2])) + " · H " + deg(to_f(f[3])) + " L " + deg(to_f(f[4])));
          }
          // hours: label|temp|condition;...
          lv_obj_t *ht[6] = {id(wxh_time_0), id(wxh_time_1), id(wxh_time_2), id(wxh_time_3), id(wxh_time_4), id(wxh_time_5)};
          lv_obj_t *hi[6] = {id(wxh_icon_0), id(wxh_icon_1), id(wxh_icon_2), id(wxh_icon_3), id(wxh_icon_4), id(wxh_icon_5)};
          lv_obj_t *hp[6] = {id(wxh_temp_0), id(wxh_temp_1), id(wxh_temp_2), id(wxh_temp_3), id(wxh_temp_4), id(wxh_temp_5)};
          auto hours = split(id(ts_wx_hours).state, ';');
          for (int i = 0; i < 6; i++) {
            if (!valid(id(ts_wx_hours).state) || i >= (int) hours.size()) { text(ht[i], "—"); text(hp[i], "—"); continue; }
            auto c = split(hours[i], '|');
            text(ht[i], field(c, 0)); text(hp[i], deg(to_f(field(c, 1)))); text(hi[i], wx_icon(field(c, 2)));
          }
          // days: day|hi|lo|pop|condition;...
          lv_obj_t *dd[5] = {id(wxd_day_0), id(wxd_day_1), id(wxd_day_2), id(wxd_day_3), id(wxd_day_4)};
          lv_obj_t *di[5] = {id(wxd_icon_0), id(wxd_icon_1), id(wxd_icon_2), id(wxd_icon_3), id(wxd_icon_4)};
          lv_obj_t *de[5] = {id(wxd_desc_0), id(wxd_desc_1), id(wxd_desc_2), id(wxd_desc_3), id(wxd_desc_4)};
          lv_obj_t *dp[5] = {id(wxd_pop_0), id(wxd_pop_1), id(wxd_pop_2), id(wxd_pop_3), id(wxd_pop_4)};
          lv_obj_t *dh[5] = {id(wxd_hi_0), id(wxd_hi_1), id(wxd_hi_2), id(wxd_hi_3), id(wxd_hi_4)};
          lv_obj_t *dl[5] = {id(wxd_lo_0), id(wxd_lo_1), id(wxd_lo_2), id(wxd_lo_3), id(wxd_lo_4)};
          auto days = split(id(ts_wx_days).state, ';');
          for (int i = 0; i < 5; i++) {
            if (!valid(id(ts_wx_days).state) || i >= (int) days.size()) { text(dd[i], "—"); text(de[i], ""); text(dp[i], ""); text(dh[i], ""); text(dl[i], ""); continue; }
            auto c = split(days[i], '|');
            text(dd[i], field(c, 0)); text(dh[i], deg(to_f(field(c, 1)))); text(dl[i], deg(to_f(field(c, 2))));
            text(dp[i], pct(to_f(field(c, 3)))); text(di[i], wx_icon(field(c, 4))); text(de[i], wx_text(field(c, 4)));
          }

  # ================================================================ notifications sheet
  - id: render_notifs
    then:
      - lambda: |-
          using namespace panel;
          panel::state().notifs = parse_notifs(id(ts_notifs).state);
          lv_obj_t *rows[6] = {id(nf_row_0), id(nf_row_1), id(nf_row_2), id(nf_row_3), id(nf_row_4), id(nf_row_5)};
          lv_obj_t *icons[6] = {id(nf_icon_0), id(nf_icon_1), id(nf_icon_2), id(nf_icon_3), id(nf_icon_4), id(nf_icon_5)};
          lv_obj_t *titles[6] = {id(nf_title_0), id(nf_title_1), id(nf_title_2), id(nf_title_3), id(nf_title_4), id(nf_title_5)};
          lv_obj_t *bodies[6] = {id(nf_body_0), id(nf_body_1), id(nf_body_2), id(nf_body_3), id(nf_body_4), id(nf_body_5)};
          lv_obj_t *times[6] = {id(nf_time_0), id(nf_time_1), id(nf_time_2), id(nf_time_3), id(nf_time_4), id(nf_time_5)};
          lv_obj_t *dismiss[6] = {id(nf_dismiss_0), id(nf_dismiss_1), id(nf_dismiss_2), id(nf_dismiss_3), id(nf_dismiss_4), id(nf_dismiss_5)};
          bool any_dismissable = false;
          for (int i = 0; i < 6; i++) {
            bool vis = i < (int) panel::state().notifs.size();
            show(rows[i], vis);
            if (!vis) continue;
            auto &n = panel::state().notifs[i];
            bool alert = n.level == "alert" || n.level == "critical" || n.level == "error";
            bool warn = n.level == "warn" || n.level == "warning";
            uint32_t col = alert ? RED : warn ? AMBER : TEXT3;
            text(icons[i], alert ? utf8(0xF0028) : warn ? utf8(0xF002A) : utf8(0xF02FD));
            text_color(icons[i], col);
            text(titles[i], n.title); text_color(titles[i], alert ? RED : warn ? AMBER : TEXT);
            text(bodies[i], n.body); text(times[i], n.time);
            show(dismiss[i], n.dismissable);
            if (n.dismissable) any_dismissable = true;
          }
          show(id(nf_empty), panel::state().notifs.empty());
          show(id(nf_clear_all), any_dismissable);

  - id: notif_dismiss
    parameters:
      n: int
    then:
      - if:
          condition:
            lambda: "return n < (int) panel::state().notifs.size();"
          then:
            - homeassistant.action:
                action: script.basement_panel_notification_dismiss
                data:
                  tag: !lambda "return panel::state().notifs[n].id;"

  - id: notif_clear
    then:
      - homeassistant.action:
          action: script.basement_panel_notification_clear_all

  # ================================================================ panel & voice sheet
  - id: render_panel
    then:
      - lambda: |-
          using namespace panel;
          text(id(val_brightness), pct(id(panel_brightness).state));
          text(id(val_voicevol), pct(id(voice_volume).state));
          set_checked(id(sw_wake), id(wake_word_enabled).state);
          text(id(val_wifi), id(panel_wifi_text).has_state() ? id(panel_wifi_text).state : "—");
          text(id(vsub_wifi), id(panel_wifi_sub).has_state() ? id(panel_wifi_sub).state : "—");
          text(id(val_fw), id(panel_fw_text).has_state() ? id(panel_fw_text).state : "—");
      - script.execute: render_hub

  - id: step_brightness
    parameters:
      delta: int
    then:
      - number.set:
          id: panel_brightness
          value: !lambda |-
            float v = id(panel_brightness).state + delta * 10;
            if (v < 10) v = 10; if (v > 100) v = 100;
            return v;

  - id: step_voice_volume
    parameters:
      delta: int
    then:
      - number.set:
          id: voice_volume
          value: !lambda |-
            float v = id(voice_volume).state + delta * 5;
            if (v < 0) v = 0; if (v > 100) v = 100;
            return v;

  # ================================================================ voice overlay
  # Show the overlay (wake word path: the assistant is already running).
  - id: voice_ui_open
    then:
      - lambda: |-
          if (!lv_obj_has_flag(id(voice), LV_OBJ_FLAG_HIDDEN)) return;
          id(close_menu).execute();
          panel::text(id(voice_transcript), "Listening…");
          panel::text(id(voice_response), "");
          panel::show(id(voice), true);
          id(g_overlay)++;
          id(g_voice_phase) = 1;
      - script.execute: voice_anim

  # Mic button / menu path: show the overlay and start a session.
  - id: voice_open
    then:
      - script.execute: voice_ui_open
      - script.execute: voice_start

  - id: voice_close
    then:
      - lambda: |-
          if (lv_obj_has_flag(id(voice), LV_OBJ_FLAG_HIDDEN)) return;
          panel::show(id(voice), false);
          id(g_overlay)--;
          id(g_voice_phase) = 0;
      - script.execute: voice_stop

  # transcript / response text pushed in by the voice assistant triggers
  - id: voice_show
    parameters:
      transcript: std::string
      response: std::string
    then:
      - lambda: |-
          if (!transcript.empty()) panel::text(id(voice_transcript), "“" + transcript + "”");
          if (!response.empty()) panel::text(id(voice_response), response);

  - id: voice_set_phase
    parameters:
      phase: int
    then:
      - lambda: "id(g_voice_phase) = phase;"

  # Lightweight level-bar / ring animation while the overlay is up
  # (LVGL animations are not exposed in YAML; a 150 ms tick is close enough).
  - id: voice_anim
    mode: restart
    then:
      - while:
          condition:
            lambda: "return id(g_voice_phase) > 0 && !lv_obj_has_flag(id(voice), LV_OBJ_FLAG_HIDDEN);"
          then:
            - lambda: |-
                static const int H[6][5] = {{14, 34, 56, 34, 14}, {34, 56, 34, 14, 34}, {56, 34, 14, 34, 56}, {34, 14, 34, 56, 34}, {14, 34, 56, 34, 14}, {24, 44, 24, 44, 24}};
                lv_obj_t *bars[5] = {id(voice_bar_0), id(voice_bar_1), id(voice_bar_2), id(voice_bar_3), id(voice_bar_4)};
                int t = id(g_voice_tick)++;
                for (int i = 0; i < 5; i++) lv_obj_set_height(bars[i], id(g_voice_phase) == 1 ? H[t % 6][i] : (id(g_voice_phase) == 3 ? H[(t + i) % 6][i] : 14));
                lv_obj_set_style_border_opa(id(voice_ring), (t % 10) < 5 ? LV_OPA_COVER : LV_OPA_60, LV_PART_MAIN);
            - delay: 150ms

  # ================================================================ clock + boot
  - id: clock_tick
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          int h12 = now.hour % 12; if (h12 == 0) h12 = 12;
          static const char *DOW[7] = {"SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"};
          panel::text(id(clock_time), panel::fmt_int("%d", h12) + ":" + panel::fmt_int("%02d", now.minute));
          panel::text(id(clock_ampm), std::string(now.hour < 12 ? "AM" : "PM") + " · " + DOW[(now.day_of_week - 1) % 7]);
      - script.execute: render_scenes

  - id: panel_init
    then:
      - lambda: |-
          lv_obj_add_state(id(sh_open_mr), LV_STATE_DISABLED);
          lv_obj_add_state(id(sh_stop_mr), LV_STATE_DISABLED);
          lv_obj_add_state(id(sh_close_mr), LV_STATE_DISABLED);
          lv_tileview_set_tile_by_index(id(tv), 2, 0, LV_ANIM_OFF);
          std::vector<lv_obj_t *> keep = {id(tv), id(sheet_notifications_body), id(sheet_not_ready_body), id(sheet_music_library_body),
            id(sheet_music_group_body), id(sheet_music_volumes_body), id(sheet_pool_settings_body), id(sheet_climate_body), id(sheet_alarm_body),
            id(sheet_motion_body), id(sheet_energy_body), id(sheet_shades_body), id(sheet_vacuum_body), id(sheet_panel_body),
            id(sheet_maintenance_body), id(sheet_release_notes_body)};
          panel::tidy(lv_screen_active(), keep);
          // LVGL's default group focuses the first button it is handed, and
          // that focus scrolls the screen to "reveal" it. Nothing here uses
          // encoder/keypad navigation, so empty the group and undo any scroll.
          if (lv_group_t *g = lv_group_get_default()) lv_group_remove_all_objs(g);
          lv_anim_delete(lv_screen_active(), nullptr);
          lv_obj_scroll_to(lv_screen_active(), 0, 0, LV_ANIM_OFF);
      - script.execute:
          id: render_dots
          p: 2
      - script.execute: render_status
      - script.execute: render_alarm
      - script.execute: render_energy
      - script.execute: render_scenes
      - script.execute: render_shades
      - script.execute: render_music
      - script.execute: render_pool
      - script.execute: render_hub
      - script.execute: render_climate
      - script.execute: render_energy_sheet
      - script.execute: render_maint
      - script.execute: render_weather
      - script.execute: render_notifs
      - script.execute: render_panel
      - script.execute: clock_tick
