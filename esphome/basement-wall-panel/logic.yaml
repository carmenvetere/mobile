                  entity_id: !lambda "return id(g_active);"
      - if:
          condition:
            lambda: "return cmd == \"media_next_track\";"
          then:
            - homeassistant.action:
                action: media_player.media_next_track
                data:
                  entity_id: !lambda "return id(g_active);"
      - if:
          condition:
            lambda: "return cmd == \"media_previous_track\";"
          then:
            - homeassistant.action:
                action: media_player.media_previous_track
                data:
                  entity_id: !lambda "return id(g_active);"

  - id: volume_set
    mode: queued
    parameters:
      entity: std::string
      level: int
    then:
      - homeassistant.action:
          action: media_player.volume_set
          data:
            entity_id: !lambda "return entity;"
            volume_level: !lambda "return panel::fmt(\"%.2f\", level / 100.0);"

  - id: set_group_volume
    parameters:
      v: int
    then:
      - lambda: |-
          using namespace panel;
          int target = ((v + 2) / 5) * 5;
          int sum = 0, cnt = 0;
          for (auto &m : id(g_grouped)) { const Player *p = find_player(panel::state().players, m); if (p) { sum += p->volume; cnt++; } }
          int avg = cnt ? sum / cnt : 0, delta = target - avg;
          for (auto &m : id(g_grouped)) {
            const Player *p = find_player(panel::state().players, m);
            int nv = (p ? p->volume : avg) + delta;
            if (nv < 0) nv = 0; if (nv > 100) nv = 100;
            id(volume_set).execute(m, nv);
          }
          text(id(np_vol_pct), std::to_string(target) + "%");

  - id: vol_set
    parameters:
      n: int
      v: int
    then:
      - lambda: |-
          if (n >= (int) id(g_grouped).size()) return;
          int t = ((v + 2) / 5) * 5;
          id(volume_set).execute(id(g_grouped)[n], t);
          lv_obj_t *pcts[8] = {id(vol_pct_0), id(vol_pct_1), id(vol_pct_2), id(vol_pct_3), id(vol_pct_4), id(vol_pct_5), id(vol_pct_6), id(vol_pct_7)};
          panel::text(pcts[n], std::to_string(t) + "%");

  - id: render_group
    then:
      - lambda: |-
          using namespace panel;
          size_t n; auto *S = speakers(n);
          lv_obj_t *rows[8] = {id(grp_row_0), id(grp_row_1), id(grp_row_2), id(grp_row_3), id(grp_row_4), id(grp_row_5), id(grp_row_6), id(grp_row_7)};
          lv_obj_t *icons[8] = {id(grp_icon_0), id(grp_icon_1), id(grp_icon_2), id(grp_icon_3), id(grp_icon_4), id(grp_icon_5), id(grp_icon_6), id(grp_icon_7)};
          lv_obj_t *names[8] = {id(grp_name_0), id(grp_name_1), id(grp_name_2), id(grp_name_3), id(grp_name_4), id(grp_name_5), id(grp_name_6), id(grp_name_7)};
          lv_obj_t *subs[8] = {id(grp_sub_0), id(grp_sub_1), id(grp_sub_2), id(grp_sub_3), id(grp_sub_4), id(grp_sub_5), id(grp_sub_6), id(grp_sub_7)};
          lv_obj_t *views[8] = {id(grp_view_0), id(grp_view_1), id(grp_view_2), id(grp_view_3), id(grp_view_4), id(grp_view_5), id(grp_view_6), id(grp_view_7)};
          lv_obj_t *marks[8] = {id(grp_mark_0), id(grp_mark_1), id(grp_mark_2), id(grp_mark_3), id(grp_mark_4), id(grp_mark_5), id(grp_mark_6), id(grp_mark_7)};
          for (size_t i = 0; i < 8 && i < n; i++) {
            std::string sid = S[i].id;
            const Player *p = find_player(panel::state().players, sid);
            bool leader = sid == id(g_active);
            bool in_group = false; for (auto &m : id(g_grouped)) if (m == sid) in_group = true;
            bool playing = p && p->playing();
            text(icons[i], utf8(S[i].icon)); text(names[i], S[i].name);
            text(subs[i], leader ? "Playing · group leader" : in_group ? "In group" : playing ? "Playing separately" : "Idle");
            bg(rows[i], ROW_SELECTED, in_group ? LV_OPA_COVER : LV_OPA_TRANSP);
            text_color(icons[i], in_group ? SLATE : TEXT3);
            text_color(names[i], in_group ? TEXT : TEXT2);
            text(marks[i], leader ? utf8(0xF071F) : in_group ? utf8(0xF05E0) : utf8(0xF0766));
            text_color(marks[i], leader ? SLATE : in_group ? SAGE : TEXT4);
            show(views[i], !leader && !in_group && playing);
          }

  - id: group_toggle
    mode: queued
    parameters:
      n: int
    then:
      - lambda: |-
          size_t cnt; auto *S = panel::speakers(cnt);
          if (n >= (int) cnt) return;
          std::string sid = S[n].id;
          if (sid == id(g_active)) return;
          bool in_group = false; for (auto &m : id(g_grouped)) if (m == sid) in_group = true;
          if (in_group) id(group_unjoin).execute(sid); else id(group_join).execute(sid);

  - id: group_join
    mode: queued
    parameters:
      entity: std::string
    then:
      - homeassistant.action:
          action: media_player.join
          data:
            entity_id: !lambda "return id(g_active);"
            group_members: !lambda "return entity;"

  - id: group_unjoin
    mode: queued
    parameters:
      entity: std::string
    then:
      - homeassistant.action:
          action: media_player.unjoin
          data:
            entity_id: !lambda "return entity;"

  - id: group_focus
    parameters:
      n: int
    then:
      - lambda: |-
          size_t cnt; auto *S = panel::speakers(cnt);
          if (n < (int) cnt) id(g_focus) = S[n].id;
      - script.execute: render_music
      - script.execute: close_sheets

  - id: render_vols
    then:
      - lambda: |-
          using namespace panel;
          lv_obj_t *rows[8] = {id(vol_row_0), id(vol_row_1), id(vol_row_2), id(vol_row_3), id(vol_row_4), id(vol_row_5), id(vol_row_6), id(vol_row_7)};
          lv_obj_t *names[8] = {id(vol_name_0), id(vol_name_1), id(vol_name_2), id(vol_name_3), id(vol_name_4), id(vol_name_5), id(vol_name_6), id(vol_name_7)};
          lv_obj_t *subs[8] = {id(vol_sub_0), id(vol_sub_1), id(vol_sub_2), id(vol_sub_3), id(vol_sub_4), id(vol_sub_5), id(vol_sub_6), id(vol_sub_7)};
          lv_obj_t *sliders[8] = {id(vol_slider_0), id(vol_slider_1), id(vol_slider_2), id(vol_slider_3), id(vol_slider_4), id(vol_slider_5), id(vol_slider_6), id(vol_slider_7)};
          lv_obj_t *pcts[8] = {id(vol_pct_0), id(vol_pct_1), id(vol_pct_2), id(vol_pct_3), id(vol_pct_4), id(vol_pct_5), id(vol_pct_6), id(vol_pct_7)};
          for (int i = 0; i < 8; i++) {
            bool vis = i < (int) id(g_grouped).size();
            show(rows[i], vis);
            if (!vis) continue;
            std::string sid = id(g_grouped)[i];
            const Player *p = find_player(panel::state().players, sid);
            int vol = p ? p->volume : 0;
            text(names[i], speaker_name(sid));
            text(subs[i], sid == id(g_active) ? "Group leader" : "In group");
            lv_slider_set_value(sliders[i], vol, LV_ANIM_OFF);
            text(pcts[i], std::to_string(vol) + "%");
          }

  # ---- library browsing (media_player.browse_media via the HA-side helper) ----
  - id: browse_fetch
    mode: queued
    parameters:
      cid: std::string
      ctype: std::string
    then:
      - homeassistant.event:
          event: esphome.basement_panel_browse
          data:
            entity_id: !lambda "return id(g_active) + std::string(\"${music_library_suffix}\");"
            media_content_id: !lambda "return cid;"
            media_content_type: !lambda "return ctype;"

  - id: browse_root
    then:
      - lambda: |-
          id(g_browse_ids).clear(); id(g_browse_types).clear(); id(g_browse_titles).clear();
          panel::state().browse_items.clear();
          id(browse_fetch).execute("", "");
      - script.execute: render_browse
      - script.execute:
          id: open_sheet
          name: music_library

  - id: browse_back
    then:
      - lambda: |-
          if (!id(g_browse_ids).empty()) { id(g_browse_ids).pop_back(); id(g_browse_types).pop_back(); id(g_browse_titles).pop_back(); }
          panel::state().browse_items.clear();
          if (id(g_browse_ids).empty()) id(browse_fetch).execute("", "");
          else id(browse_fetch).execute(id(g_browse_ids).back(), id(g_browse_types).back());
      - script.execute: render_browse

  - id: browse_tap
    parameters:
      n: int
    then:
      - lambda: |-
          if (n >= (int) panel::state().browse_items.size()) return;
          auto it = panel::state().browse_items[n];
          if (it.expandable) {
            id(g_browse_ids).push_back(it.id); id(g_browse_types).push_back(it.type); id(g_browse_titles).push_back(it.name);
            panel::state().browse_items.clear();
            id(browse_fetch).execute(it.id, it.type);
            id(render_browse).execute();
          } else {
            id(play_media).execute(it.id, it.type);
            id(close_sheets).execute();
          }

  - id: recent_tap
    parameters:
      n: int
    then:
      - lambda: |-
          if (n >= (int) panel::state().recents.size()) return;
          auto it = panel::state().recents[n];
          id(play_media).execute(it.id, it.type);
          id(close_sheets).execute();

  - id: play_media
    mode: queued
    parameters:
      cid: std::string
      ctype: std::string
    then:
      - homeassistant.action:
          action: media_player.play_media
          data:
            entity_id: !lambda "return id(g_active) + std::string(\"${music_library_suffix}\");"
            media_content_id: !lambda "return cid;"
            media_content_type: !lambda "return ctype;"

  - id: render_browse
    then:
      - lambda: |-
          using namespace panel;
          bool root = id(g_browse_ids).empty();
          if (!root || valid(id(ts_browse_items).state)) panel::state().browse_items = parse_browse(id(ts_browse_items).state);
          panel::state().recents = parse_browse(id(ts_recents).state);
          text(id(sheet_music_library_title), root ? "Library" : id(g_browse_titles).back());
          show(id(lib_back), !root);
          text(id(lib_back_lbl), id(g_browse_ids).size() > 1 ? id(g_browse_titles)[id(g_browse_titles).size() - 2] : "Library");
          show(id(lib_eyebrow_recent), root && !panel::state().recents.empty());
          lv_obj_t *rrows[5] = {id(rc_row_0), id(rc_row_1), id(rc_row_2), id(rc_row_3), id(rc_row_4)};
          lv_obj_t *ricons[5] = {id(rc_icon_0), id(rc_icon_1), id(rc_icon_2), id(rc_icon_3), id(rc_icon_4)};
          lv_obj_t *rnames[5] = {id(rc_name_0), id(rc_name_1), id(rc_name_2), id(rc_name_3), id(rc_name_4)};
          lv_obj_t *rsubs[5] = {id(rc_sub_0), id(rc_sub_1), id(rc_sub_2), id(rc_sub_3), id(rc_sub_4)};
          for (int i = 0; i < 5; i++) {
            bool vis = root && i < (int) panel::state().recents.size();
            show(rrows[i], vis);
            if (!vis) continue;
            auto &it = panel::state().recents[i];
            text(ricons[i], browse_icon(it.type)); text(rnames[i], it.name); text(rsubs[i], it.sub);
          }
          text(id(lib_eyebrow_library), root ? "LIBRARY" : "");
          show(id(lib_eyebrow_library), root);
          lv_obj_t *rows[12] = {id(br_row_0), id(br_row_1), id(br_row_2), id(br_row_3), id(br_row_4), id(br_row_5), id(br_row_6), id(br_row_7), id(br_row_8), id(br_row_9), id(br_row_10), id(br_row_11)};
          lv_obj_t *icons[12] = {id(br_icon_0), id(br_icon_1), id(br_icon_2), id(br_icon_3), id(br_icon_4), id(br_icon_5), id(br_icon_6), id(br_icon_7), id(br_icon_8), id(br_icon_9), id(br_icon_10), id(br_icon_11)};
          lv_obj_t *names[12] = {id(br_name_0), id(br_name_1), id(br_name_2), id(br_name_3), id(br_name_4), id(br_name_5), id(br_name_6), id(br_name_7), id(br_name_8), id(br_name_9), id(br_name_10), id(br_name_11)};
          lv_obj_t *subs[12] = {id(br_sub_0), id(br_sub_1), id(br_sub_2), id(br_sub_3), id(br_sub_4), id(br_sub_5), id(br_sub_6), id(br_sub_7), id(br_sub_8), id(br_sub_9), id(br_sub_10), id(br_sub_11)};
          lv_obj_t *trails[12] = {id(br_trail_0), id(br_trail_1), id(br_trail_2), id(br_trail_3), id(br_trail_4), id(br_trail_5), id(br_trail_6), id(br_trail_7), id(br_trail_8), id(br_trail_9), id(br_trail_10), id(br_trail_11)};
          for (int i = 0; i < 12; i++) {
            bool vis = i < (int) panel::state().browse_items.size();
            show(rows[i], vis);
            if (!vis) continue;
            auto &it = panel::state().browse_items[i];
            text(icons[i], browse_icon(it.type)); text(names[i], it.name); text(subs[i], it.sub);
            text(trails[i], it.expandable ? utf8(0xF0142) : utf8(0xF040A));
            text_color(trails[i], it.expandable ? HANDLE : SLATE);
          }
          show(id(lib_empty), panel::state().browse_items.empty() && (!root || panel::state().recents.empty()));
          lv_obj_scroll_to_y(id(sheet_music_library_body), 0, LV_ANIM_OFF);

  # ================================================================ pool page
  - id: render_pool
    then:
      - lambda: |-
          using namespace panel;
          float sp = id(s_pool_setpoint).state, wt = id(s_water_temp).state, speed = id(s_pump_speed).state;
          bool heater_on = valid(id(ts_heater).state) && id(ts_heater).state != "off";
          int spi = std::isnan(sp) ? 80 : (int) lroundf(sp);
          text(id(pool_setpoint), std::isnan(sp) ? "—" : deg(sp));
          text_color(id(pool_setpoint), heater_on ? TEXT : TEXT3);
          lv_arc_set_value(id(pool_arc), spi);
          lv_obj_set_style_arc_color(id(pool_arc), C(heater_on ? SLATE : TEXT4), LV_PART_INDICATOR);
          text(id(pool_water), std::isnan(wt) ? "Water —" : "Water " + deg(wt));
          if (heater_on) { bg(id(pool_heater_pill), SLATE); text(id(pool_heater_icon), utf8(0xF0238)); text(id(pool_heater_lbl), "On"); text_color(id(pool_heater_icon), ON_SLATE); text_color(id(pool_heater_lbl), ON_SLATE); }
          else { bg(id(pool_heater_pill), ROW_SELECTED); text(id(pool_heater_icon), utf8(0xF0425)); text(id(pool_heater_lbl), "Off"); text_color(id(pool_heater_icon), TEXT2); text_color(id(pool_heater_lbl), TEXT2); }
          // filter pump
          bool on = id(bs_pump).state;
          int pctv = std::isnan(speed) ? 0 : (int) lroundf(speed);
          set_checked(id(pump_switch), on);
          text(id(pump_pct), on ? std::to_string(pctv) + "%" : "Off");
          text_color(id(pump_icon), on ? SLATE : TEXT4);
          lv_slider_set_value(id(pump_slider), on ? pctv : 0, LV_ANIM_ON);
          slider_fill(id(pump_slider), on ? SLATE : TEXT4);
          std::string cur = pctv <= 45 ? "low" : pctv <= 80 ? "medium" : "high";
          pill(id(chip_low), nullptr, id(chip_low_lbl), on && cur == "low");
          pill(id(chip_med), nullptr, id(chip_med_lbl), on && cur == "medium");
          pill(id(chip_high), nullptr, id(chip_high_lbl), on && cur == "high");
          text_color(id(chip_low_pct), on && cur == "low" ? ON_SLATE : TEXT3);
          text_color(id(chip_med_pct), on && cur == "medium" ? ON_SLATE : TEXT3);
          text_color(id(chip_high_pct), on && cur == "high" ? ON_SLATE : TEXT3);
          // pool settings sheet
          float salt = id(s_salt).state, cp = id(s_chlor_pct).state;
          text(id(val_salt), std::isnan(salt) ? "—" : thousands((long) lroundf(salt)) + " ppm");
          text(id(val_watertemp), std::isnan(wt) ? "—" : deg(wt));
          lv_slider_set_value(id(chlor_slider), std::isnan(cp) ? 0 : (int) lroundf(cp), LV_ANIM_OFF);
          text(id(chlor_pct), std::isnan(cp) ? "—" : pct(cp));

  - id: pool_setpoint_step
    parameters:
      delta: int
    then:
      - homeassistant.action:
          action: water_heater.set_temperature
          data:
            entity_id: water_heater.omnilogic_pool_heater
            temperature: !lambda |-
              float sp = id(s_pool_setpoint).state;
              int v = (std::isnan(sp) ? 80 : (int) lroundf(sp)) + delta;
              if (v < 70) v = 70; if (v > 90) v = 90;
              return std::to_string(v);

  - id: pool_heater_toggle
    then:
      - if:
          condition:
            lambda: "return panel::valid(id(ts_heater).state) && id(ts_heater).state != \"off\";"
          then:
