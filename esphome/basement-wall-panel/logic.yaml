# Basement Wall Panel — panel-local state and the scripts that drive the UI.
#
# State model (design handoff → "State model"): page · overlays (menu / voice /
# sheet stack) · code · armTarget · focus player · browse path · scene flash.
# Everything else is read straight from the Home Assistant imports in
# entities.yaml at render time.

globals:
  - id: g_page
    type: int
    initial_value: "2"
  - id: g_overlay
    type: int
    initial_value: "0"
  - id: g_sheets
    type: std::vector<lv_obj_t *>
  - id: g_code
    type: std::string
  - id: g_arm_target
    type: std::string
  - id: g_flash_hint
    type: bool
    initial_value: "false"
  - id: g_scene_codes
    type: std::vector<int>
  - id: g_scene_flash
    type: int
    initial_value: "-1"
  - id: g_focus
    type: std::string
  - id: g_active
    type: std::string
  - id: g_grouped
    type: std::vector<std::string>
  - id: g_browse_ids
    type: std::vector<std::string>
  - id: g_browse_types
    type: std::vector<std::string>
  - id: g_browse_titles
    type: std::vector<std::string>
  - id: g_art_url
    type: std::string
  - id: g_tx0
    type: int
    initial_value: "0"
  - id: g_ty0
    type: int
    initial_value: "0"
  - id: g_tx1
    type: int
    initial_value: "0"
  - id: g_ty1
    type: int
    initial_value: "0"
  - id: g_voice_phase
    type: int
    initial_value: "0"
  - id: g_voice_tick
    type: int
    initial_value: "0"

script:
  # ================================================================ navigation
  - id: render_dots
    parameters:
      p: int
    then:
      - lambda: |-
          lv_obj_t *dots[7] = {id(dot_0), id(dot_1), id(dot_2), id(dot_3), id(dot_4), id(dot_5), id(dot_6)};
          for (int i = 0; i < 7; i++) {
            lv_obj_set_width(dots[i], i == p ? 28 : 8);
            panel::bg(dots[i], i == p ? panel::SLATE : panel::HAIRLINE);
          }

  - id: on_tile_changed
    then:
      - lambda: |-
          lv_obj_t *t = lv_tileview_get_tile_active(id(tv));
          lv_obj_t *tiles[7] = {id(tile_alarm), id(tile_energy), id(tile_scenes), id(tile_shades), id(tile_music), id(tile_pool), id(tile_settings)};
          for (int i = 0; i < 7; i++) if (tiles[i] == t) id(g_page) = i;
          id(render_dots).execute(id(g_page));

  - id: set_page
    parameters:
      n: int
    then:
      - script.execute: close_all
      - lambda: |-
          id(g_page) = n;
          lv_tileview_set_tile_by_index(id(tv), n, 0, LV_ANIM_ON);
          id(render_dots).execute(n);

  - id: open_menu
    then:
      - lambda: |-
          if (!lv_obj_has_flag(id(menu), LV_OBJ_FLAG_HIDDEN)) return;
          lv_obj_t *items[8] = {id(menu_item_0), id(menu_item_1), id(menu_item_2), id(menu_item_3), id(menu_item_4), id(menu_item_5), id(menu_item_6), id(menu_item_7)};
          lv_obj_t *icons[8] = {id(menu_icon_0), id(menu_icon_1), id(menu_icon_2), id(menu_icon_3), id(menu_icon_4), id(menu_icon_5), id(menu_icon_6), id(menu_icon_7)};
          lv_obj_t *lbls[8] = {id(menu_lbl_0), id(menu_lbl_1), id(menu_lbl_2), id(menu_lbl_3), id(menu_lbl_4), id(menu_lbl_5), id(menu_lbl_6), id(menu_lbl_7)};
          for (int i = 0; i < 8; i++) panel::pill(items[i], icons[i], lbls[i], i == id(g_page));
          panel::show(id(menu), true);
          id(g_overlay)++;

  - id: close_menu
    then:
      - lambda: |-
          if (lv_obj_has_flag(id(menu), LV_OBJ_FLAG_HIDDEN)) return;
          panel::show(id(menu), false);
          id(g_overlay)--;

  - id: toggle_menu
    then:
      - lambda: |-
          if (lv_obj_has_flag(id(menu), LV_OBJ_FLAG_HIDDEN)) id(open_menu).execute(); else id(close_menu).execute();

  - id: menu_go
    parameters:
      n: int
    then:
      - lambda: |-
          if (n == 7) { id(close_menu).execute(); id(voice_open).execute(); }
          else id(set_page).execute(n);

  - id: open_sheet
    parameters:
      name: std::string
    then:
      - lambda: |-
          lv_obj_t *s = nullptr;
          if (name == "weather") s = id(sheet_weather);
          else if (name == "notifications") s = id(sheet_notifications);
          else if (name == "not_ready") s = id(sheet_not_ready);
          else if (name == "music_library") s = id(sheet_music_library);
          else if (name == "music_group") s = id(sheet_music_group);
          else if (name == "music_volumes") s = id(sheet_music_volumes);
          else if (name == "pool_settings") s = id(sheet_pool_settings);
          else if (name == "climate") s = id(sheet_climate);
          else if (name == "alarm") s = id(sheet_alarm);
          else if (name == "motion") s = id(sheet_motion);
          else if (name == "energy") s = id(sheet_energy);
          else if (name == "shades") s = id(sheet_shades);
          else if (name == "vacuum") s = id(sheet_vacuum);
          else if (name == "panel") s = id(sheet_panel);
          else if (name == "maintenance") s = id(sheet_maintenance);
          else if (name == "release_notes") s = id(sheet_release_notes);
          if (s == nullptr) return;
          for (auto *o : id(g_sheets)) if (o == s) return;
          id(g_sheets).push_back(s);
          panel::show(s, true);
          lv_obj_scroll_to_y(s, 0, LV_ANIM_OFF);
          id(g_overlay)++;

  # Close the top-most sheet (release notes → back to maintenance, etc.)
  - id: close_sheets
    then:
      - lambda: |-
          if (id(g_sheets).empty()) return;
          lv_obj_t *s = id(g_sheets).back();
          id(g_sheets).pop_back();
          panel::show(s, false);
          id(g_overlay)--;

  - id: close_all
    then:
      - lambda: |-
          while (!id(g_sheets).empty()) {
            panel::show(id(g_sheets).back(), false);
            id(g_sheets).pop_back();
            id(g_overlay)--;
          }
          panel::show(id(confirm_offgrid), false);
      - script.execute: close_menu

  # Touch gestures (fed by the touchscreen triggers in the device config).
  # Left/right page swipes are native to the tileview; here we only handle the
  # swipe-down (menu open) and swipe-up (menu close).
  - id: touch_down
    parameters:
      x: int
      y: int
    then:
      - lambda: |-
          id(g_tx0) = x; id(g_ty0) = y; id(g_tx1) = x; id(g_ty1) = y;

  - id: touch_up
    then:
      - lambda: |-
          int dx = id(g_tx1) - id(g_tx0), dy = id(g_ty1) - id(g_ty0);
          bool menu_open = !lv_obj_has_flag(id(menu), LV_OBJ_FLAG_HIDDEN);
          if (id(g_overlay) > 0) {
            if (menu_open && dy < -60) id(close_menu).execute();
            return;
          }
          if (dy > 70 && abs(dx) < 60) id(open_menu).execute();

  - id: critical_tap
    then:
      - lambda: |-
          if (id(ts_alarm).state == "triggered") id(set_page).execute(0); else id(set_page).execute(1);

  # ================================================================ status bar
  - id: render_status
    then:
      - lambda: |-
          using namespace panel;
          std::string alarm = id(ts_alarm).has_state() ? id(ts_alarm).state : "disarmed";
          bool trig = alarm == "triggered";
          bool outage = id(bs_grid).has_state() && !id(bs_grid).state;
          bool crit = trig || outage;
          show(id(chip_weather), !crit); show(id(chip_alarm), !crit); show(id(chip_notif), !crit);
          show(id(pill_critical), crit);
          if (crit) {
            if (trig) { text(id(sb_crit_icon), utf8(0xF078F)); text(id(sb_crit_text), "Alarm Triggered!"); }
            else {
              float ch = id(s_pw_charge).state;
              text(id(sb_crit_icon), utf8(0xF06A6));
              text(id(sb_crit_text), std::isnan(ch) ? "Power Outage!" : "Power Outage! Powerwall " + pct(ch));
            }
          }
          // weather chip
          text(id(sb_wx_icon), wx_icon(id(ts_weather_cond).state));
          float t = id(s_outdoor_temp).state;
          text(id(sb_wx_temp), std::isnan(t) ? "--°" : deg(t));
          // alarm chip
          uint32_t col = SAGE; std::string icon = utf8(0xF099C), txt = "Off";
          if (alarm == "arming") { col = AMBER; icon = utf8(0xF11A2); txt = "Arming"; }
          else if (alarm == "armed_home") { col = GOLD; icon = utf8(0xF068A); txt = "Home"; }
          else if (alarm == "armed_away") { col = GOLD; icon = utf8(0xF099D); txt = "Away"; }
          else if (alarm == "armed_night" || alarm == "armed_vacation" || alarm == "armed_custom_bypass") { col = GOLD; icon = utf8(0xF099D); txt = "Armed"; }
          else if (alarm == "pending") { col = AMBER; icon = utf8(0xF11A2); txt = "Pending"; }
          else if (trig) { col = RED; icon = utf8(0xF078F); txt = "Alarm"; }
          text(id(sb_alarm_icon), icon); text_color(id(sb_alarm_icon), col);
          text(id(sb_alarm_text), txt); text_color(id(sb_alarm_text), col);
          // notifications chip
          float n = id(s_notif_count).state;
          int count = std::isnan(n) ? 0 : (int) lroundf(n);
          text(id(sb_bell_count), std::to_string(count));
          text_color(id(sb_bell_icon), count > 0 ? AMBER : TEXT3);
          text_color(id(sb_bell_count), count > 0 ? AMBER : TEXT3);

  # ================================================================ alarm page
  - id: render_alarm
    then:
      - lambda: |-
          using namespace panel;
          std::string alarm = id(ts_alarm).has_state() ? id(ts_alarm).state : "disarmed";
          bool trig = alarm == "triggered";
          bool open[6] = {
            id(bs_door_front).state, id(bs_door_kitchen).state, id(bs_door_living).state,
            id(bs_door_mudroom).state, id(bs_door_garage_entry).state,
            valid(id(ts_garage_door).state) && id(ts_garage_door).state != "closed"};
          int n_open = 0;
          std::string names[6] = {"Front Door", "Kitchen French Doors", "Living Room French Doors", "Mudroom Entry Door", "Garage Entry", "Garage Door"};
          lv_obj_t *icons[6] = {id(door_icon_0), id(door_icon_1), id(door_icon_2), id(door_icon_3), id(door_icon_4), id(door_icon_5)};
          lv_obj_t *states[6] = {id(door_state_0), id(door_state_1), id(door_state_2), id(door_state_3), id(door_state_4), id(door_state_5)};
          std::string open_names;
          for (int i = 0; i < 6; i++) {
            if (open[i]) { n_open++; open_names += (open_names.empty() ? "" : ", ") + names[i]; }
            text(states[i], open[i] ? "Open" : "Closed");
            text_color(states[i], open[i] ? AMBER : SLATE);
            text_color(icons[i], open[i] ? AMBER : SLATE);
          }
          if (trig) { text(id(ready_icon), utf8(0xF078F)); text(id(ready_text), "Triggered"); text_color(id(ready_icon), RED); text_color(id(ready_text), RED); }
          else if (n_open) { text(id(ready_icon), utf8(0xF05D6)); text(id(ready_text), "Not ready to arm"); text_color(id(ready_icon), AMBER); text_color(id(ready_text), AMBER); }
          else { text(id(ready_icon), utf8(0xF05E1)); text(id(ready_text), "Ready to arm"); text_color(id(ready_icon), SAGE); text_color(id(ready_text), SAGE); }
          text(id(not_ready_sub), n_open ? open_names + " open" : "All 6 sensors closed");
          // mode buttons
          struct { lv_obj_t *b, *i, *l; const char *mode; } modes[3] = {
            {id(mode_home), id(mode_home_icon), id(mode_home_lbl), "armed_home"},
            {id(mode_away), id(mode_away_icon), id(mode_away_lbl), "armed_away"},
            {id(mode_disarm), id(mode_disarm_icon), id(mode_disarm_lbl), "disarmed"}};
          for (auto &m : modes) {
            bool on = alarm == m.mode;
            bool pending = (alarm == "arming" || alarm == "pending") && id(g_arm_target) == m.mode;
            if (pending) { bg(m.b, PENDING); border(m.b, PENDING); text_color(m.i, SLATE); text_color(m.l, TEXT); }
            else pill(m.b, m.i, m.l, on);
          }
          // code dots + hint
          lv_obj_t *dots[4] = {id(code_dot_0), id(code_dot_1), id(code_dot_2), id(code_dot_3)};
          for (int i = 0; i < 4; i++) bg(dots[i], i < (int) id(g_code).size() ? SLATE : HAIRLINE);
          if (!id(g_flash_hint)) {
            text(id(code_hint), alarm == "disarmed" ? "" : "Enter code to disarm");
            text_color(id(code_hint), TEXT3);
          }

  - id: flash_hint
    mode: restart
    then:
      - lambda: |-
          id(g_flash_hint) = true;
          panel::text(id(code_hint), "Enter your 4-digit code first");
          panel::text_color(id(code_hint), panel::AMBER);
      - delay: 1800ms
      - lambda: "id(g_flash_hint) = false;"
      - script.execute: render_alarm

  - id: key_tap
    parameters:
      k: int
    then:
      - lambda: |-
          if (k <= 9) { if (id(g_code).size() < 4) id(g_code) += (char) ('0' + k); }
          else if (k == 10) { if (!id(g_code).empty()) id(g_code).pop_back(); }
          else if (k == 11) {
            if (id(g_code).size() == 4) id(alarm_disarm).execute(); else id(flash_hint).execute();
          }
          id(render_alarm).execute();

  - id: alarm_disarm
    then:
      - homeassistant.action:
          action: alarmo.disarm
          data:
            entity_id: alarm_control_panel.alarmo
            code: !lambda "return id(g_code);"
      - lambda: "id(g_code).clear(); id(g_arm_target).clear();"
      - script.execute: render_alarm

  - id: alarm_mode
    parameters:
      mode: std::string
    then:
      - if:
          condition:
            lambda: "return mode == \"disarmed\";"
          then:
            - if:
                condition:
                  lambda: "return id(g_code).size() == 4;"
                then:
                  - script.execute: alarm_disarm
                else:
                  - script.execute: flash_hint
          else:
            - lambda: "id(g_arm_target) = mode;"
            - homeassistant.action:
                action: alarmo.arm
                data:
                  entity_id: alarm_control_panel.alarmo
                  mode: !lambda "return mode == \"armed_home\" ? std::string(\"home\") : std::string(\"away\");"
            - script.execute: render_alarm

  # ================================================================ energy page
  - id: render_energy
    then:
      - lambda: |-
          using namespace panel;
          auto val = [](float v) { return std::isnan(v) ? std::string("—") : kw(v); };
          text(id(en_solar), val(id(s_solar).state));
          text(id(en_grid), val(id(s_grid).state));
          text(id(en_home), val(id(s_load).state));
          float b = id(s_battery).state, ch = id(s_pw_charge).state, rs = id(s_reserve).state;
          text(id(en_batt), val(b));
          bool charging = !std::isnan(b) && b < -50;
          text(id(en_batt_lbl), std::isnan(b) || fabsf(b) <= 50 ? "Idle" : (charging ? "Charging" : "Discharging"));
          text(id(en_batt_icon), battery_icon(std::isnan(ch) ? 100 : ch, charging));
          text(id(en_charge), std::isnan(ch) ? "—" : pct(ch));
          lv_slider_set_value(id(en_slider), std::isnan(ch) ? 0 : (int) lroundf(ch), LV_ANIM_ON);
          int reserve = std::isnan(rs) ? 20 : (int) lroundf(rs);
          text(id(en_reserve_lbl), "· reserve " + std::to_string(reserve) + "%");
          lv_obj_set_x(id(en_reserve_marker), (656 * reserve) / 100 - 1);

  - id: set_reserve
    parameters:
      v: int
    then:
      - homeassistant.action:
          action: number.set_value
          data:
            entity_id: number.bayberry_backup_reserve
            value: !lambda |-
              int r = ((v + 2) / 5) * 5;
              if (r < 5) r = 5; if (r > 100) r = 100;
              return std::to_string(r);
      - delay: 1500ms
      - script.execute: render_energy

  - id: step_reserve
    parameters:
      delta: int
    then:
      - lambda: |-
          float rs = id(s_reserve).state;
          int r = (std::isnan(rs) ? 20 : (int) lroundf(rs)) + delta * 5;
          id(set_reserve).execute(r);

  # ================================================================ scenes page
  # Scene codes: 0 Morning · 1 Working · 2 Cleaning · 3 Welcome · 4 Basement
  # Evening · 5 Entertaining · 6 Movie · 7 Emergency · 8 Nightlight · 9 Outdoor ·
  # 10 All Off · 11 Morning (daytime icon). The sets per period follow the
  # design prototype (Morning · Day · Evening · Night); the period itself is
  # picked with the repo's time / sun-elevation rules.
  - id: render_scenes
    then:
      - lambda: |-
          using namespace panel;
          auto now = id(ha_time).now();
          int mins = now.is_valid() ? now.hour * 60 + now.minute : 19 * 60;
          float el = id(s_sun_elevation).state;
          bool has_el = !std::isnan(el);
          bool night = mins >= 1320 || mins < 300;
          bool morning = !night && mins < 720;
          bool evening = !night && !morning && ((has_el && el < 15) || mins >= 17 * 60 || !has_el);
          std::vector<int> codes;
          if (night) codes = {7, 4, 6, 8, 9, 10};
          else if (morning) codes = {0, 1, 2, 9, 10};
          else if (evening) codes = {3, 4, 5, 6, 9, 10};
          else codes = {11, 1, 2, 9, 10};
          id(g_scene_codes) = codes;
          bool outdoor_on = id(bs_outdoor_lights).state;
          struct Def { const char *name; uint32_t icon; bool active; uint32_t icon_color; };
          auto def = [&](int c) -> Def {
            switch (c) {
              case 0: return {"Morning", 0xF059C, id(bs_sc_good_morning).state, SLATE};
              case 1: return {"Working", 0xF095F, id(bs_sc_basement_work).state, SLATE};
              case 2: return {"Cleaning", 0xF0AE0, id(bs_sc_basement_cleaning).state, SLATE};
              case 3: return {"Welcome", 0xF17C4, id(bs_sc_welcome).state, SLATE};
              case 4: return {"Basement Evening", 0xF0F65, id(bs_sc_basement_evening).state, SLATE};
              case 5: return {"Entertaining", 0xF1056, id(bs_sc_basement_entertaining).state, SLATE};
              case 6: return {"Movie", 0xF1705, id(bs_sc_movie).state, SLATE};
              case 7: return {"Emergency", 0xF0FF6, id(bs_sc_emergency).state, RED};
              case 8: return {"Nightlight", 0xF1A4C, id(bs_sc_nightlight).state, SLATE};
              case 9: return {outdoor_on ? "Outdoor Off" : "Outdoor", 0xF1020, false, SLATE};
              case 11: return {"Morning", 0xF0599, id(bs_sc_good_morning).state, SLATE};
              default: return {"All Off", 0xF0E4F, id(bs_sc_good_night).state, SLATE};
            }
          };
          lv_obj_t *rows[6] = {id(sc_row_0), id(sc_row_1), id(sc_row_2), id(sc_row_3), id(sc_row_4), id(sc_row_5)};
          lv_obj_t *icons[6] = {id(sc_icon_0), id(sc_icon_1), id(sc_icon_2), id(sc_icon_3), id(sc_icon_4), id(sc_icon_5)};
          lv_obj_t *names[6] = {id(sc_name_0), id(sc_name_1), id(sc_name_2), id(sc_name_3), id(sc_name_4), id(sc_name_5)};
          lv_obj_t *actives[6] = {id(sc_name_active_0), id(sc_name_active_1), id(sc_name_active_2), id(sc_name_active_3), id(sc_name_active_4), id(sc_name_active_5)};
          lv_obj_t *ons[6] = {id(sc_on_0), id(sc_on_1), id(sc_on_2), id(sc_on_3), id(sc_on_4), id(sc_on_5)};
          lv_obj_t *glows[6] = {id(sc_glow_0), id(sc_glow_1), id(sc_glow_2), id(sc_glow_3), id(sc_glow_4), id(sc_glow_5)};
          lv_obj_t *chevs[6] = {id(sc_chev_0), id(sc_chev_1), id(sc_chev_2), id(sc_chev_3), id(sc_chev_4), id(sc_chev_5)};
          for (int i = 0; i < 6; i++) {
            bool vis = i < (int) codes.size();
            show(rows[i], vis);
            if (!vis) continue;
            Def d = def(codes[i]);
            bool active = d.active || id(g_scene_flash) == i;
            text(icons[i], utf8(d.icon)); text_color(icons[i], d.icon_color);
            text(names[i], d.name); text(actives[i], d.name);
            text_color(names[i], codes[i] == 10 ? TEXT2 : TEXT);
            show(names[i], !active); show(actives[i], active);
            show(ons[i], active); show(glows[i], active); show(chevs[i], !active);
            lv_obj_set_style_border_opa(rows[i], i == (int) codes.size() - 1 ? LV_OPA_TRANSP : LV_OPA_COVER, LV_PART_MAIN);
          }

  - id: scene_tap
    parameters:
      slot: int
    then:
      - lambda: |-
          if (slot >= (int) id(g_scene_codes).size()) return;
          static const char *ENT[12] = {"scene.good_morning_2", "scene.basement_work", "scene.basement_cleaning", "scene.welcome",
                                        "scene.basement_evening", "scene.basement_entertaining", "scene.movie", "scene.emergency",
                                        "scene.nightlight", "scene.outdoor_on", "scene.good_night", "scene.good_morning_2"};
          int c = id(g_scene_codes)[slot];
          std::string ent = ENT[c];
          if (c == 9 && id(bs_outdoor_lights).state) ent = "scene.outdoor_off";
          id(scene_turn_on).execute(ent);
          id(g_scene_flash) = slot;
          id(render_scenes).execute();
          id(scene_flash_end).execute();

  - id: scene_flash_end
    mode: restart
    then:
      - delay: 1600ms
      - lambda: "id(g_scene_flash) = -1;"
      - script.execute: render_scenes

  - id: scene_turn_on
    mode: queued
    parameters:
      entity: std::string
    then:
      - homeassistant.action:
          action: scene.turn_on
          data:
            entity_id: !lambda "return entity;"

  # ================================================================ shades page
  - id: render_shades
    then:
      - lambda: |-
          using namespace panel;
          auto label = [](const std::string &st, float pos) -> std::string {
            if (st == "opening") return "Opening…";
            if (st == "closing") return "Closing…";
            if (!valid(st)) return "—";
            int p = std::isnan(pos) ? (st == "closed" ? 0 : 100) : (int) lroundf(pos);
            if (p <= 0 || st == "closed") return "Closed";
            return "Open · " + std::to_string(p) + "%";
          };
          text(id(sh_state_ff), label(id(ts_ff_state).state, id(s_ff_pos).state));
          // Whole House = min/max over the six covers (no group entity)
          std::string st[6] = {id(ts_cv_0).state, id(ts_cv_1).state, id(ts_cv_2).state, id(ts_cv_3).state, id(ts_cv_4).state, id(ts_cv_5).state};
          float ps[6] = {id(s_cv_0).state, id(s_cv_1).state, id(s_cv_2).state, id(s_cv_3).state, id(s_cv_4).state, id(s_cv_5).state};
          bool opening = false, closing = false, any = false; int lo = 100, hi = 0;
          for (int i = 0; i < 6; i++) {
            if (st[i] == "opening") opening = true;
            if (st[i] == "closing") closing = true;
            if (!valid(st[i])) continue;
            int p = std::isnan(ps[i]) ? (st[i] == "closed" ? 0 : 100) : (int) lroundf(ps[i]);
            any = true; if (p < lo) lo = p; if (p > hi) hi = p;
          }
          std::string wh = "—";
          if (opening) wh = "Opening…";
          else if (closing) wh = "Closing…";
          else if (any) wh = hi <= 0 ? "Closed" : (lo == hi ? "Open · " + std::to_string(hi) + "%" : "Open · " + std::to_string(lo) + "–" + std::to_string(hi) + "%");
          text(id(sh_state_wh), wh);
          text(id(sh_state_mr), "");
          show(id(sh_badge_mr), true);

  - id: shade_cmd
