  # ================================================================ settings hub + sheets
  - id: render_hub
    then:
      - lambda: |-
          using namespace panel;
          auto cnt = [](std::initializer_list<bool> l) { int c = 0; for (bool b : l) if (b) c++; return c; };
          text(id(hub_val_climate), std::to_string(cnt({id(bs_z_lr).state, id(bs_z_bs).state, id(bs_z_of).state, id(bs_z_bd).state})) + " of 4 zones");
          text(id(hub_val_alarm), std::to_string(cnt({id(bs_a_leave).state, id(bs_a_11pm).state, id(bs_a_7am).state, id(bs_a_arrive).state})) + " of 4 rules");
          text(id(hub_val_motion), std::to_string(cnt({id(bs_m_out).state, id(bs_m_bath).state, id(bs_m_gym).state, id(bs_l_eve).state, id(bs_l_morn).state, id(bs_l_night).state, id(bs_l_sunset).state, id(bs_l_mid).state, id(bs_l_spot).state})) + " of 9 on");
          float rs = id(s_reserve).state;
          text(id(hub_val_energy), std::isnan(rs) ? "Reserve —" : "Reserve " + pct(rs));
          text(id(hub_val_shades), id(bs_s_sched).state ? "Scheduler on" : "Scheduler off");
          text(id(hub_val_vacuum), id(bs_v_night).state ? "Nightly 12am" : "Off");
          text(id(hub_val_panel), pct(id(panel_brightness).state) + " · " + (id(wake_word_enabled).state ? "wake on" : "wake off"));
          pill(id(tile_guests), id(tile_icon_guests), id(tile_lbl_guests), id(bs_guest).state);
          pill(id(tile_cleaners), id(tile_icon_cleaners), id(tile_lbl_cleaners), id(bs_cleaners).state);
          pill(id(tile_dinner), id(tile_icon_dinner), id(tile_lbl_dinner), id(bs_dinner).state);
          pill(id(tile_offgrid), id(tile_icon_offgrid), id(tile_lbl_offgrid), id(bs_offgrid).state);
          if (!id(bs_guest).state) text_color(id(tile_lbl_guests), TEXT2);
          if (!id(bs_cleaners).state) text_color(id(tile_lbl_cleaners), TEXT2);
          if (!id(bs_dinner).state) text_color(id(tile_lbl_dinner), TEXT2);
          if (!id(bs_offgrid).state) text_color(id(tile_lbl_offgrid), TEXT2);
          text(id(val_reserve), std::isnan(rs) ? "—" : pct(rs));

  - id: ha_toggle
