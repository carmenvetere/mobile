# Headless test harness: feeds the prototype's demo data into every import and
# walks the UI, taking a screenshot of each page and sheet. Not for the panel.
script:
  - id: mock_data
    then:
      - lambda: |-
          id(ts_weather_cond).publish_state("partlycloudy");
          id(s_outdoor_temp).publish_state(72);
          id(ts_alarm).publish_state("disarmed");
          id(s_notif_count).publish_state(3);
          id(bs_grid).publish_state(true);
          id(s_pw_charge).publish_state(76);
          id(s_solar).publish_state(4.2); id(s_grid).publish_state(0); id(s_load).publish_state(1.8); id(s_battery).publish_state(-2.4);
          id(s_reserve).publish_state(20);
          id(s_sun_elevation).publish_state(30);
          id(bs_door_front).publish_state(false); id(bs_door_kitchen).publish_state(false); id(bs_door_living).publish_state(false);
          id(bs_door_mudroom).publish_state(false); id(bs_door_garage_entry).publish_state(false); id(ts_garage_door).publish_state("open");
          id(bs_sc_good_morning).publish_state(false); id(bs_sc_basement_work).publish_state(false); id(bs_sc_basement_cleaning).publish_state(false);
          id(bs_sc_welcome).publish_state(false); id(bs_sc_basement_evening).publish_state(true); id(bs_sc_basement_entertaining).publish_state(false);
          id(bs_sc_movie).publish_state(false); id(bs_sc_emergency).publish_state(false); id(bs_sc_nightlight).publish_state(false);
          id(bs_sc_good_night).publish_state(false); id(bs_outdoor_lights).publish_state(true); id(bs_dinner).publish_state(false);
          id(ts_ff_state).publish_state("open"); id(s_ff_pos).publish_state(100);
          const char *cv[6] = {"open","open","open","open","closed","open"};
          id(ts_cv_0).publish_state(cv[0]); id(ts_cv_1).publish_state(cv[1]); id(ts_cv_2).publish_state(cv[2]); id(ts_cv_3).publish_state(cv[3]); id(ts_cv_4).publish_state(cv[4]); id(ts_cv_5).publish_state(cv[5]);
          id(s_cv_0).publish_state(100); id(s_cv_1).publish_state(100); id(s_cv_2).publish_state(100); id(s_cv_3).publish_state(100); id(s_cv_4).publish_state(0); id(s_cv_5).publish_state(100);
          id(ts_players).publish_state(
            "media_player.media_room|playing|32|Ocean Floor|Bonobo · Fragments|media_player.media_room|media_player.media_room,media_player.pool|/art.jpg;"
            "media_player.pool|playing|45|Ocean Floor|Bonobo · Fragments|media_player.media_room|media_player.media_room,media_player.pool|/art.jpg;"
            "media_player.mud_room|idle|15||||media_player.mud_room|;media_player.gym|idle|20||||media_player.gym|;"
            "media_player.living_room|playing|28|Kind of Blue|Miles Davis|media_player.living_room|media_player.living_room|;"
            "media_player.kitchen|playing|24|Dinner Jazz|Music Assistant playlist|media_player.kitchen|media_player.kitchen|/art.jpg;"
            "media_player.office|idle|18||||media_player.office|;media_player.deck|idle|30||||media_player.deck|;"
            "media_player.shop|idle|25||||media_player.shop|");
          id(ts_browse_title).publish_state("Library");
          id(ts_browse_items).publish_state("Playlists|18|playlist|library://playlists|1;Stations|9|radio|library://radios|1;Albums|867|album|library://albums|1;Artists|1,204|artist|library://artists|1;Favorites|All providers|favorite|library://favorites|1");
          id(ts_recents).publish_state("Pool Mix — 2026|Playlist|playlist|a|0;Radio Paradise|Station|radio|b|0;Dinner Jazz|Playlist|playlist|c|0;Deep Focus|Playlist|playlist|d|0;WNYC|Station|radio|e|0");
          id(ts_heater).publish_state("heat_pump"); id(s_pool_setpoint).publish_state(88); id(s_water_temp).publish_state(84);
          id(bs_pump).publish_state(true); id(s_pump_speed).publish_state(35); id(s_salt).publish_state(3200); id(s_chlor_pct).publish_state(60);
          id(bs_chlor).publish_state(true);
          id(s_fa_lr).publish_state(62); id(s_fa_bs).publish_state(60); id(s_co2_ceiling).publish_state(1100); id(s_co2_recover).publish_state(850);
          id(s_vent_min).publish_state(45); id(s_vent_max).publish_state(78); id(s_freecool).publish_state(4); id(s_minvent).publish_state(90);
          id(s_away_heat).publish_state(62); id(s_away_cool).publish_state(78);
          id(s_e_well).publish_state(1.4); id(s_e_pool).publish_state(6.8); id(s_e_ev).publish_state(11.2);
          id(s_upper_filter).publish_state(2140); id(s_lower_filter).publish_state(744);
          id(ts_wh_flushed).publish_state("2026-03-14 10:00:00"); id(ts_dryer_cleaned).publish_state("2026-01-08 10:00:00");
          id(ts_wx_now).publish_state("72|partlycloudy|74|79|61");
          id(ts_wx_hours).publish_state("Now|72|partlycloudy;3 PM|76|partlycloudy;4 PM|78|sunny;5 PM|77|sunny;6 PM|73|cloudy;7 PM|69|rainy");
          id(ts_wx_days).publish_state("Today|79|61|40|partlycloudy;Mon|74|58|80|pouring;Tue|71|55|20|windy;Wed|77|57|0|sunny;Thu|82|63|10|sunny");
          id(ts_notifs).publish_state("filter|warn|Upper HVAC filter due|Changed 94 days ago — replace and reset in Settings.|Today, 8:02 AM;door|alert|Basement door left open|Open 22 minutes. Alarm cannot arm to Away.|18 minutes ago;grid|info|Peak rate window starts at 4 PM|Powerwall will hold reserve at 20% until 9 PM.|1 hour ago");
          id(bs_guest).publish_state(true); id(bs_cleaners).publish_state(false); id(bs_offgrid).publish_state(false); id(bs_away).publish_state(false);
          id(s_alarm_delay).publish_state(30); id(s_pw_remaining).publish_state(10.3);
          id(idle_return).publish_state(600);   // shortened at the end of the walk
          id(bs_z_lr).publish_state(true); id(bs_z_bs).publish_state(true); id(bs_z_of).publish_state(false); id(bs_z_bd).publish_state(true);
          id(bs_a_leave).publish_state(true); id(bs_a_11pm).publish_state(true); id(bs_a_7am).publish_state(true); id(bs_a_arrive).publish_state(false);
          id(bs_m_out).publish_state(true); id(bs_m_bath).publish_state(true); id(bs_m_gym).publish_state(true);
          id(bs_l_eve).publish_state(true); id(bs_l_morn).publish_state(true); id(bs_l_night).publish_state(true); id(bs_l_sunset).publish_state(true); id(bs_l_mid).publish_state(true); id(bs_l_spot).publish_state(true);
          id(bs_s_sched).publish_state(true); id(bs_s_sunset).publish_state(true); id(bs_s_bed).publish_state(true); id(bs_s_bg).publish_state(true); id(bs_s_fg).publish_state(true);
          id(bs_s_m_ff).publish_state(false); id(bs_s_m_pb).publish_state(false); id(bs_s_m_of).publish_state(false); id(bs_s_m_bg).publish_state(false); id(bs_s_m_fg).publish_state(false);
          id(bs_v_night).publish_state(true);
          panel::text(id(clock_time), "5:48"); panel::text(id(clock_ampm), "AM · FRI");

  - id: walk
    then:
      - delay: 1500ms
      - script.execute: mock_data
      - delay: 800ms
      - lambda: "paneltest::snap(\"01-scenes\");"
      - script.execute: { id: set_page, n: 0 }
      - delay: 600ms
      - lambda: "paneltest::snap(\"02-alarm\");"
      - script.execute: { id: set_page, n: 1 }
      - delay: 600ms
      - lambda: "paneltest::snap(\"03-energy\");"
      - script.execute: { id: set_page, n: 3 }
      - delay: 600ms
      - lambda: "paneltest::snap(\"04-shades\");"
      - script.execute: { id: set_page, n: 4 }
      - delay: 600ms
      - lambda: "paneltest::snap(\"05-music\");"
      # pick the pool, then have it pause: the page must stay on the pool
      - script.execute: { id: group_focus, n: 1 }
      - lambda: |-
          std::string s = id(ts_players).state;
          size_t at = s.find("media_player.pool|playing|");
          if (at != std::string::npos) s.replace(at, 26, "media_player.pool|paused|");
          id(ts_players).publish_state(s);
      - delay: 400ms
      - lambda: "paneltest::snap(\"27-music-pool-paused\");"
      - script.execute: { id: set_page, n: 5 }
      - delay: 600ms
      - lambda: "paneltest::snap(\"06-pool\");"
      - script.execute: { id: set_page, n: 6 }
      - delay: 600ms
      - lambda: "paneltest::snap(\"07-settings\");"
      - lambda: "id(bs_cleaners).publish_state(true);"
      - delay: 300ms
      - lambda: "paneltest::snap(\"23-cleaners-lock\"); id(bs_cleaners).publish_state(false);"
      - script.execute: { id: set_page, n: 2 }
      - lambda: "id(bs_away).publish_state(true);"
      - delay: 500ms
      - lambda: "paneltest::snap(\"24-status-vacation\"); id(bs_away).publish_state(false);"
      - lambda: "id(bs_grid).publish_state(false);"
      - delay: 600ms
      - lambda: "paneltest::snap(\"25-energy-outage\"); id(bs_grid).publish_state(true);"
      - script.execute: { id: set_page, n: 6 }
      - delay: 500ms
      - script.execute: voice_ui_open
      - delay: 300ms
      - lambda: "paneltest::snap(\"09-voice\");"
      - script.execute: voice_close
      - script.execute: { id: open_sheet, name: weather }
      - delay: 300ms
      - lambda: "paneltest::snap(\"10-weather\");"
      - script.execute: close_sheets
      - script.execute: { id: open_sheet, name: notifications }
      - delay: 300ms
      - lambda: "paneltest::snap(\"11-notifications\");"
      - script.execute: close_sheets
      - script.execute: { id: open_sheet, name: music_library }
      - delay: 300ms
      - lambda: "paneltest::snap(\"12-library\");"
      - script.execute: close_sheets
      - script.execute: { id: open_sheet, name: music_group }
      - delay: 300ms
      - lambda: "paneltest::snap(\"14-group\");"
      - script.execute: close_sheets
      - script.execute: { id: open_sheet, name: music_volumes }
      - delay: 300ms
      - lambda: "paneltest::snap(\"15-volumes\");"
      - script.execute: close_sheets
      - script.execute: { id: open_sheet, name: pool_settings }
      - delay: 300ms
      - lambda: "paneltest::snap(\"16-pool-settings\");"
      - script.execute: close_sheets
      - script.execute: { id: open_sheet, name: maintenance }
      - delay: 300ms
      - lambda: "paneltest::snap(\"17-maintenance\");"
      - script.execute: close_sheets
      - script.execute: { id: open_sheet, name: energy }
      - delay: 300ms
      - lambda: "paneltest::snap(\"18-energy-grid\");"
      - script.execute: close_sheets
      - script.execute: { id: open_sheet, name: climate }
      - delay: 300ms
      - lambda: "paneltest::snap(\"19-climate\");"
      - script.execute: close_sheets
      - script.execute: { id: open_sheet, name: release_notes }
      - delay: 300ms
      - lambda: "paneltest::snap(\"20-release-notes\");"
      - script.execute: close_sheets
      - script.execute: { id: open_sheet, name: not_ready }
      - delay: 300ms
      - lambda: "paneltest::snap(\"21-not-ready\");"
      - script.execute: close_sheets
      - lambda: "id(ts_alarm).publish_state(\"pending\");"
      - delay: 600ms
      - lambda: "paneltest::snap(\"26-alarm-pending\");"
      - lambda: "id(ts_alarm).publish_state(\"triggered\");"
      - delay: 600ms
      - lambda: "paneltest::snap(\"22-critical\");"
      # idle return: leave a sheet open on Settings, shorten the timeout, and
      # wait for it to fire. Media Room is playing, so the default is Music.
      - lambda: "id(ts_alarm).publish_state(\"disarmed\");"
      - script.execute: { id: set_page, n: 6 }
      - script.execute: { id: open_sheet, name: panel }
      - lambda: "id(idle_return).publish_state(30);"
      - delay: 20s
      - lambda: |-
          ESP_LOGI("mock", "tick %u ms, inactive %u ms, idle_return %.0f", (unsigned) lv_tick_get(), (unsigned) lv_display_get_inactive_time(nullptr), id(idle_return).state);
          paneltest::snap("28-idle-default");
      - script.execute: qa

  # ---- scripted QA: taps + state transitions, asserting on UI state and on
  # the HA actions each tap emits (see test/qa.h). Exits 1 on any failure.
  - id: qa
    then:
      - lambda: |-
          using namespace paneltest;
          id(idle_return).publish_state(600);   // keep the idle return out of the way
          id(g_focus) = "";

          begin("navigation");
          tap(id(tab_1)); expect_eq(id(g_page), 0, "tab 2 opens Alarm");
          tap(id(tab_6)); expect_eq(id(g_page), 6, "tab 7 opens Settings");
          tap(id(tab_0)); expect_eq(id(g_page), 2, "tab 1 opens Home");
          id(open_sheet).execute("weather"); expect_visible(id(sheet_weather), true, "weather sheet opens");
          tap(id(tab_0)); expect_visible(id(sheet_weather), false, "tab tap closes the open sheet");

          begin("scenes");
          id(bs_outdoor_lights).publish_state(true); id(render_scenes).execute();
          int slot_out = -1, slot_alloff = -1;
          for (size_t i = 0; i < id(g_scene_codes).size(); i++) { if (id(g_scene_codes)[i] == 9) slot_out = i; if (id(g_scene_codes)[i] == 10) slot_alloff = i; }
          lv_obj_t *rows[6] = {id(sc_row_0), id(sc_row_1), id(sc_row_2), id(sc_row_3), id(sc_row_4), id(sc_row_5)};
          lv_obj_t *ons[6] = {id(sc_on_0), id(sc_on_1), id(sc_on_2), id(sc_on_3), id(sc_on_4), id(sc_on_5)};
          check(slot_out >= 0 && slot_alloff >= 0, "Outdoor and All Off are in every period's set");
          if (slot_out >= 0) {
            expect_visible(ons[slot_out], true, "Outdoor row shows ON while the lights are on");
            clear_calls(); tap(rows[slot_out]);
            expect_call("scene.turn_on", {{"entity_id", "scene.outdoor_off"}}, "Outdoor tap while on runs scene.outdoor_off");
            id(bs_outdoor_lights).publish_state(false); id(g_scene_flash) = -1; id(render_scenes).execute();
            expect_visible(ons[slot_out], false, "Outdoor row is plain while the lights are off");
            clear_calls(); tap(rows[slot_out]);
            expect_call("scene.turn_on", {{"entity_id", "scene.outdoor_on"}}, "Outdoor tap while off runs scene.outdoor_on");
          }
          if (slot_alloff >= 0) { clear_calls(); tap(rows[slot_alloff]); expect_call("scene.turn_on", {{"entity_id", "scene.good_night"}}, "All Off runs scene.good_night"); }
          id(g_scene_flash) = -1; id(render_scenes).execute();

          begin("alarm");
          tap(id(tab_1));
          clear_calls(); tap(id(key_ok));
          expect_no_call("alarmo.disarm", "OK with no code sends nothing");
          expect_text(id(code_hint), "Enter your 4-digit code first", "OK with no code shows the hint");
          tap(id(key_1)); tap(id(key_2)); tap(id(key_back)); tap(id(key_2)); tap(id(key_3)); tap(id(key_4));
          expect_eq(id(g_code), "1234", "digits and backspace edit the code");
          clear_calls(); tap(id(key_ok));
          expect_call("alarmo.disarm", {{"entity_id", "alarm_control_panel.alarmo"}, {"code", "1234"}}, "OK with 4 digits disarms with the code");
          expect_eq(id(g_code), "", "code is cleared after sending");
          clear_calls(); tap(id(mode_away));
          expect_call("alarmo.arm", {{"entity_id", "alarm_control_panel.alarmo"}, {"mode", "away"}}, "Away arms in away mode");
          expect_eq(id(g_arm_target), "armed_away", "Away is remembered as the pending target");
          clear_calls(); tap(id(mode_home));
          expect_call("alarmo.arm", {{"mode", "home"}}, "Home arms in home mode");
          clear_calls(); tap(id(mode_disarm));
          expect_no_call("alarmo.disarm", "Disarm button without a code sends nothing");
          id(g_flash_hint) = false; id(g_arm_target).clear();

          begin("shades");
          tap(id(tab_3));
          clear_calls(); tap(id(sh_open_ff));
          expect_call("cover.open_cover", {{"entity_id", "cover.first_floor_all"}}, "First floor up opens cover.first_floor_all");
          clear_calls(); tap(id(sh_close_wh));
          expect_call("cover.close_cover", {{"entity_id", "${whole_house_covers}"}}, "Whole House down closes all six covers in one call");
          clear_calls(); tap(id(sh_stop_mr));
          expect_no_call("cover.stop_cover", "Media Room (no entity yet) sends nothing");

          begin("energy");
          // mock: solar 4.2, home 1.8, battery charging 2.4, grid 0 → amber solar→home + solar→battery, grid rails idle
          expect_visible(id(en_line_solar_home), true, "solar→home flow line shown");
          expect_visible(id(en_line_solar_batt), true, "solar→battery flow line shown");
          expect_visible(id(en_line_grid_home), false, "grid→home stays idle");
          expect_visible(id(en_line_batt_home), false, "battery→home stays idle while charging");
          expect_visible(id(en_dot_2), true, "solar→home dots animate");
          expect_visible(id(en_dot_10), false, "grid→home dots hidden");
          id(s_solar).publish_state(0.3); id(s_grid).publish_state(1.5); id(s_battery).publish_state(0);
          expect_visible(id(en_line_grid_home), true, "grid import → grid→home flow line shown");
          expect_visible(id(en_line_solar_batt), false, "no surplus → solar→battery hidden");
          id(s_solar).publish_state(4.2); id(s_grid).publish_state(0); id(s_battery).publish_state(-2.4);
          clear_calls(); id(step_reserve).execute(1);
          expect_call("number.set_value", {{"entity_id", "number.bayberry_backup_reserve"}, {"value", "25"}}, "reserve + steps 20% to 25%");
          clear_calls(); id(set_reserve).execute(2);
          expect_call("number.set_value", {{"value", "5"}}, "reserve never goes below 5%");

          begin("pool");
          tap(id(tab_5));
          clear_calls(); tap(id(pool_plus));
          expect_call("water_heater.set_temperature", {{"entity_id", "water_heater.omnilogic_pool_heater"}, {"temperature", "89"}}, "+ asks for setpoint + 1");
          id(s_pool_setpoint).publish_state(90);
          clear_calls(); tap(id(pool_plus));
          expect_call("water_heater.set_temperature", {{"temperature", "90"}}, "+ clamps at 90");
          clear_calls(); tap(id(pool_minus));
          expect_call("water_heater.set_temperature", {{"temperature", "89"}}, "- asks for setpoint - 1");
          id(s_pool_setpoint).publish_state(88);
          clear_calls(); tap(id(pool_heater_pill));
          expect_call("water_heater.turn_off", {{"entity_id", "water_heater.omnilogic_pool_heater"}}, "heater pill turns the running heater off");
          id(ts_heater).publish_state("off"); clear_calls(); tap(id(pool_heater_pill));
          expect_call("water_heater.turn_on", {{"entity_id", "water_heater.omnilogic_pool_heater"}}, "heater pill turns the idle heater on");
          id(ts_heater).publish_state("heat_pump");
          clear_calls(); tap(id(chip_high));
          expect_call("button.press", {{"entity_id", "button.omnilogic_pool_filter_pump_high_speed"}}, "High preset presses the high-speed button");
          clear_calls(); id(pump_speed).execute(47);
          expect_call("number.set_value", {{"entity_id", "number.omnilogic_pool_filter_pump_speed"}, {"value", "45"}}, "pump slider rounds to 5%");

          begin("music");
          tap(id(tab_4)); id(render_music).execute();
          expect_eq(id(g_active), "media_player.media_room", "auto mode follows the playing Media Room");
          clear_calls(); tap(id(btn_play));
          expect_call("media_player.media_play_pause", {{"entity_id", "media_player.media_room"}}, "play/pause targets the active speaker");
          tap(id(np_spk_chip)); expect_visible(id(sheet_music_group), true, "speaker chip opens the Speakers sheet");
          tap(id(grp_row_1));
          expect_eq(id(g_active), "media_player.pool", "picking Pool makes it the active speaker");
          expect_visible(id(sheet_music_group), false, "picking a speaker closes the sheet");
          expect_text_has(id(np_spk_name), "Pool", "chip names the picked speaker");
          clear_calls(); tap(id(btn_play));
          expect_call("media_player.media_play_pause", {{"entity_id", "media_player.pool"}}, "transport follows the pick");
          tap(id(btn_group));
          clear_calls(); tap(id(grp_join_7));
          expect_call("media_player.join", {{"entity_id", "media_player.pool"}, {"group_members", "media_player.deck"}}, "+ joins Deck to the picked speaker's group");
          clear_calls(); tap(id(grp_join_0));
          expect_call("media_player.unjoin", {{"entity_id", "media_player.media_room"}}, "- removes a group member");
          clear_calls(); tap(id(grp_row_1));
          expect_no_call("media_player.join", "tapping a row never changes grouping");
          clear_calls(); id(set_group_volume).execute(50);
          expect_eq(count_calls("media_player.volume_set"), (long) id(g_grouped).size(), "group volume sets every member");
          // group volume moves every member by the same delta (32 → 44, 45 → 57 for a 38 → 50 move), keeping their offsets
          expect_call("media_player.volume_set", {{"entity_id", "media_player.media_room"}, {"volume_level", "0.44"}}, "group volume keeps the quieter speaker's offset");
          expect_call("media_player.volume_set", {{"entity_id", "media_player.pool"}, {"volume_level", "0.57"}}, "group volume keeps the louder speaker's offset");
          id(g_focus) = ""; id(render_music).execute();
          expect_eq(id(g_active), "media_player.media_room", "clearing the pick returns to auto mode");

          begin("library");
          clear_calls(); tap(id(btn_library));
          expect_visible(id(sheet_music_library), true, "Library button opens the sheet");
          expect_call("esphome.basement_panel_browse", {{"entity_id", "media_player.media_room"}, {"media_content_id", ""}}, "opening asks HA for the root");
          id(ts_browse_items).publish_state("Playlists|Music Assistant|playlist|playlist|1;Radio|Stations|radio|radio|1");
          id(render_browse).execute();
          expect_text(id(br_name_0), "Playlists", "root rows render");
          clear_calls(); tap(id(br_row_0));
          expect_call("esphome.basement_panel_browse", {{"media_content_id", "playlist"}, {"media_content_type", "playlist"}}, "expandable row asks HA for that category");
          expect_text(id(sheet_music_library_title), "Playlists", "title follows the category");
          id(ts_browse_items).publish_state("Dinner Jazz|Playlist|playlist|library://playlist/1|0");
          id(render_browse).execute();
          clear_calls(); tap(id(br_row_0));
          expect_call("esphome.basement_panel_play", {{"entity_id", "media_player.media_room"}, {"media_content_id", "library://playlist/1"}, {"media_content_type", "playlist"}, {"source", "library"}}, "playable row plays via the panel play event");
          expect_visible(id(sheet_music_library), false, "playing closes the sheet");
          tap(id(btn_library)); tap(id(lib_back));
          expect_eq((long) id(g_browse_ids).size(), 0, "back from a category returns to root");
          clear_calls(); tap(id(rc_row_0));
          expect_call("esphome.basement_panel_play", {{"source", "recent"}}, "recents play with source=recent");
          id(close_sheets).execute();

          begin("notifications");
          tap(id(chip_notif)); expect_visible(id(sheet_notifications), true, "bell opens notifications");
          clear_calls(); tap(id(nf_dismiss_1));
          expect_call("script.basement_panel_notification_dismiss", {{"tag", "door"}}, "row dismiss sends the alert's tag");
          clear_calls(); tap(id(nf_clear_all));
          expect_call("script.basement_panel_notification_clear_all", {}, "Clear all runs the clear script");
          id(close_sheets).execute();

          begin("settings");
          tap(id(tab_6));
          clear_calls(); tap(id(tile_guests));
          expect_call("homeassistant.turn_off", {{"entity_id", "input_boolean.guest_mode"}}, "Guests tile turns the active mode off");
          clear_calls(); tap(id(tile_vacation));
          expect_call("homeassistant.turn_on", {{"entity_id", "input_boolean.away_mode"}}, "Vacation tile turns away mode on");
          clear_calls(); tap(id(tile_offgrid));
          expect_visible(id(confirm_offgrid), true, "Off Grid asks first");
          expect_no_call("homeassistant.turn_on", "Off Grid sends nothing before confirming");
          tap(id(confirm_offgrid_cancel));
          expect_visible(id(confirm_offgrid), false, "Cancel closes the confirm");
          expect_no_call("homeassistant.turn_on", "Cancel sends nothing");
          tap(id(tile_offgrid)); clear_calls(); tap(id(confirm_offgrid_go));
          expect_call("homeassistant.turn_on", {{"entity_id", "switch.bayberry_off_grid_operation"}}, "Go off grid turns the switch on");
          expect_visible(id(confirm_offgrid), false, "confirm closes after Go");
          id(open_sheet).execute("maintenance");
          clear_calls(); tap(id(mbtn_upper));
          expect_call("script.reset_upper_floors_filter_runtime", {}, "Maintenance RESET runs the repo script");
          id(close_sheets).execute();

          begin("cleaners lock");
          id(bs_cleaners).publish_state(true);
          expect_visible(id(lock), true, "cleaners mode shows the lock");
          tap(id(lock_key_9)); tap(id(lock_key_9)); tap(id(lock_key_9)); tap(id(lock_key_9));
          clear_calls(); tap(id(lock_ok));
          expect_no_call("homeassistant.turn_off", "wrong PIN sends nothing");
          expect_text(id(lock_hint), "Incorrect code", "wrong PIN shows the error");
          expect_eq(id(g_lock_code), "", "wrong PIN clears the entry");
          tap(id(lock_key_1)); tap(id(lock_key_2)); tap(id(lock_key_3)); tap(id(lock_key_4));
          clear_calls(); tap(id(lock_ok));
          expect_call("homeassistant.turn_off", {{"entity_id", "input_boolean.cleaners_mode"}}, "right PIN turns cleaners mode off");
          id(bs_cleaners).publish_state(false); id(g_lock_flash) = false; id(render_lock).execute();
          expect_visible(id(lock), false, "lock hides when cleaners mode ends");

          begin("transitions");
          tap(id(tab_6));
          id(s_alarm_delay).publish_state(0);           // HA's delay sensor lags the alarm state
          id(ts_alarm).publish_state("pending");
          expect_eq(id(g_page), 0, "alarm pending jumps to Alarm");
          id(s_alarm_delay).publish_state(30);
          expect_eq(id(g_pending_left), 30, "a late-arriving entry delay still starts the countdown");
          expect_text_has(id(code_hint), "Enter code to disarm · 30s", "pending shows the countdown");
          id(g_arm_target) = "armed_away"; id(ts_alarm).publish_state("armed_home");
          expect_eq(id(g_arm_target), "", "arming from elsewhere clears the panel's pending target");
          id(ts_alarm).publish_state("pending");
          id(bs_grid).publish_state(false);
          expect_eq(id(g_page), 0, "an outage during a pending alarm stays on Alarm");
          id(bs_grid).publish_state(true);
          id(ts_alarm).publish_state("disarmed");
          tap(id(tab_6));
          id(bs_grid).publish_state(false);
          expect_eq(id(g_page), 1, "grid drop jumps to Energy");
          expect_visible(id(energy_outage), true, "outage layout shows");
          expect_visible(id(pill_critical), true, "critical pill shows during an outage");
          id(bs_grid).publish_state(true);
          expect_visible(id(energy_outage), false, "outage layout hides when the grid returns");
          tap(id(tab_6)); id(ts_alarm).publish_state("triggered");
          expect_eq(id(g_page), 0, "triggered jumps to Alarm");
          tap(id(tab_6)); tap(id(pill_critical));
          expect_eq(id(g_page), 0, "critical pill opens Alarm while triggered");
          id(ts_alarm).publish_state("disarmed");
          expect_visible(id(pill_critical), false, "critical pill hides once calm");
          id(bs_away).publish_state(true); expect_visible(id(pill_vacation), true, "vacation pill shows");
          id(bs_away).publish_state(false); expect_visible(id(pill_vacation), false, "vacation pill hides");
          id(bs_guest).publish_state(true); expect_visible(id(sb_mode_guest), true, "guest mode icon shows");
          id(bs_guest).publish_state(false); expect_visible(id(sb_mode_guest), false, "guest mode icon hides");

          begin("idle hygiene");
          tap(id(tab_1)); tap(id(key_1)); tap(id(key_2));
          id(go_default).execute();
          expect_eq(id(g_code), "", "idle return forgets a half-typed alarm code");
          id(g_reserve_target) = -1; clear_calls(); id(step_reserve).execute(1); id(step_reserve).execute(1);
          expect_call("number.set_value", {{"value", "25"}}, "first reserve tap steps 20 → 25");
          expect_call("number.set_value", {{"value", "30"}}, "a second tap before HA echoes steps 25 → 30");
          id(g_reserve_target) = -1;

          begin("browse pending");
          id(g_browse_pending) = false; id(ts_browse_items).publish_state("Dinner Jazz|Playlist|playlist|library://playlist/1|0");
          tap(id(btn_library));
          expect_eq((long) panel::state().browse_items.size(), 0, "opening Library never shows the previous answer while waiting");
          id(ts_browse_items).publish_state("Playlists|Music Assistant|playlist|playlist|1");
          expect_eq((long) panel::state().browse_items.size(), 1, "the answer renders when it lands");
          id(close_sheets).execute();

          begin("edge cases");
          std::string saved = id(ts_players).state;
          id(ts_players).publish_state(""); id(render_music).execute();
          expect_text(id(np_title), "Nothing playing", "no players: Music shows Nothing playing");
          id(ts_players).publish_state("media_player.media_room|unavailable|0||||media_player.media_room|"); id(render_music).execute();
          expect_text(id(np_title), "Nothing playing", "unavailable player: no title");
          id(g_focus) = "media_player.ghost"; id(ts_players).publish_state(saved); id(render_music).execute();
          expect_eq(id(g_focus), "", "a pick that vanished from the list is forgotten");
          id(ts_notifs).publish_state(""); id(render_notifs).execute();
          expect_visible(id(nf_empty), true, "no notifications shows the empty state");
          id(ts_browse_items).publish_state(""); id(browse_root).execute(); id(close_sheets).execute();
          expect_visible(id(lib_empty), false, "root with recents but no items is not 'nothing here'");
          id(ts_recents).publish_state(""); id(browse_root).execute(); id(close_sheets).execute();
          expect_visible(id(lib_empty), true, "root with nothing at all shows 'nothing here'");
          id(s_outdoor_temp).publish_state(NAN); id(render_status).execute();
          expect_text(id(sb_wx_temp), "--°", "missing weather shows a placeholder, not garbage");
          finish();
