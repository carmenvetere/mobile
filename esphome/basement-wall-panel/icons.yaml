# Basement Wall Panel — design tokens and Material Design Icon glyphs.
#
# Every value here is an ESPHome substitution so the LVGL YAML can say
# `text_color: ${c_slate}` or `text: "${i_cog}"`. Colors come straight from the
# design handoff (Design tokens → Colors). Icon codepoints were taken from
# MaterialDesign meta.json; the glyphs themselves are compiled into the
# `mdi_*` fonts declared in fonts.yaml — add any new icon to both places.

substitutions:
  # ---- colors ---------------------------------------------------------------
  c_bg: "0x121417"          # page background
  c_sheet: "0x17191d"       # full-screen sheet body
  c_hairline: "0x2a2e35"    # all borders, dividers, slider tracks, inactive dots
  c_hairline_dim: "0x22252b"
  c_row_selected: "0x1c2024"
  c_handle: "0x3d434c"      # menu handle bar, chevrons, off toggle track
  c_art_fallback: "0x1a1d22"
  c_text: "0xffffff"
  c_text2: "0xc3c7cc"
  c_text3: "0x8a9099"
  c_text4: "0x5b616a"
  c_slate: "0x8EB1BF"       # Dune Mist — standard icon color / active fill
  c_slate_bright: "0xB6D2DC"
  c_on_slate: "0x16202a"
  c_sage: "0x8BA680"
  c_gold: "0xE2C168"
  c_amber: "0xE0A75E"
  c_red: "0xE0695B"
  c_pending: "0x625a43"

  # ---- icons (MDI codepoints, UTF-8 encoded by YAML) -------------------------
