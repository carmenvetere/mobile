# Page 2 · Energy (Powerwall / solar power flow)
id: tile_energy
row: 0
column: 1
dir: HOR
widgets:
  - obj:
      styles: st_page
      widgets:
        - label:
            x: 32
            y: 40
            text: "Energy"
            text_font: b300_34
