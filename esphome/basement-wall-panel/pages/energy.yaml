              # Solar (top) — icon amber
              - label: { x: 0, y: 0, width: 656, text: "Solar", text_align: CENTER, text_font: b400_19, text_color: "${c_text2}" }
              - obj:
                  x: 280
                  y: 26
                  styles: st_circle_96
                  bg_color: ${c_bg}
                  bg_opa: COVER
                  clickable: false
                  widgets:
                    - label: { align: TOP_MID, y: 16, text: "${i_solar_power_variant}", text_font: mdi_30, text_color: "${c_amber}" }
                    - label: { id: en_solar, align: BOTTOM_MID, y: -16, text: "—", text_font: b600_17 }
              # Grid (left) — slate; text-4 icon / text-3 value while idle
              - obj:
                  x: 16
                  y: 167
                  styles: st_circle_96
                  bg_color: ${c_bg}
                  bg_opa: COVER
                  clickable: false
                  widgets:
                    - label: { id: en_grid_icon, align: TOP_MID, y: 16, text: "${i_transmission_tower}", text_font: mdi_30, text_color: "${c_slate}" }
                    - label: { id: en_grid, align: BOTTOM_MID, y: -16, text: "—", text_font: b600_17 }
              - label: { x: 16, y: 270, width: 96, text: "Grid", text_align: CENTER, text_font: b400_19, text_color: "${c_text2}" }
              # Home (right) — slate
              - obj:
                  x: 544
                  y: 167
                  styles: st_circle_96
                  bg_color: ${c_bg}
                  bg_opa: COVER
                  clickable: false
                  widgets:
                    - label: { align: TOP_MID, y: 16, text: "${i_home_lightning_bolt}", text_font: mdi_30, text_color: "${c_slate}" }
