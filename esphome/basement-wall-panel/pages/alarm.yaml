# Page 1 · Alarm (alarm_control_panel.alarmo)
id: tile_alarm
row: 0
column: 0
dir: HOR
widgets:
  - obj:
      styles: st_page
      widgets:
        - label:
            x: 32
            y: 40
            text: "Security"
            text_font: b300_34
        # readiness row (tap → not-ready sheet)
        - obj:
            id: ready_row
            x: 32
            y: 96
            width: 340
            height: 40
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_cross: CENTER
              flex_align_track: CENTER
              pad_column: 8
            widgets:
              - label:
                  id: ready_icon
                  text: "${i_check_circle_outline}"
                  text_font: mdi_24
                  text_color: ${c_sage}
              - label:
                  id: ready_text
                  text: "Ready to arm"
                  text_font: b400_17
                  text_color: ${c_sage}
              - label:
                  text: "${i_chevron_right}"
                  text_font: mdi_24
                  text_color: ${c_text3}
            on_click:
              - script.execute:
                  id: open_sheet
                  name: not_ready
        # code dots
        - obj:
            align: TOP_MID
            x: 0
            y: 148
            width: SIZE_CONTENT
            height: 18
            clickable: false
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_cross: CENTER
              flex_align_track: CENTER
              pad_column: 16
            widgets:
              - obj: { id: code_dot_0, width: 18, height: 18, radius: 9, bg_color: "${c_hairline}", bg_opa: COVER, clickable: false }
              - obj: { id: code_dot_1, width: 18, height: 18, radius: 9, bg_color: "${c_hairline}", bg_opa: COVER, clickable: false }
              - obj: { id: code_dot_2, width: 18, height: 18, radius: 9, bg_color: "${c_hairline}", bg_opa: COVER, clickable: false }
              - obj: { id: code_dot_3, width: 18, height: 18, radius: 9, bg_color: "${c_hairline}", bg_opa: COVER, clickable: false }
        - label:
            id: code_hint
            align: TOP_MID
            x: 0
            y: 176
            text: "Enter code to disarm"
            text_font: b400_15
            text_color: ${c_text3}
        # keypad 3×4, 112×76 keys, 12px gap
        - obj:
            align: TOP_MID
            x: 0
            y: 204
            width: 360
            height: 340
            clickable: false
            layout:
              type: FLEX
              flex_flow: ROW_WRAP
              flex_align_main: SPACE_BETWEEN
              flex_align_cross: CENTER
              flex_align_track: CENTER
              pad_row: 12
              pad_column: 12
            widgets:
              - !include { file: ../widgets/key.yaml, vars: { k: 1 } }
              - !include { file: ../widgets/key.yaml, vars: { k: 2 } }
              - !include { file: ../widgets/key.yaml, vars: { k: 3 } }
              - !include { file: ../widgets/key.yaml, vars: { k: 4 } }
              - !include { file: ../widgets/key.yaml, vars: { k: 5 } }
              - !include { file: ../widgets/key.yaml, vars: { k: 6 } }
              - !include { file: ../widgets/key.yaml, vars: { k: 7 } }
              - !include { file: ../widgets/key.yaml, vars: { k: 8 } }
              - !include { file: ../widgets/key.yaml, vars: { k: 9 } }
              - button:
                  id: key_back
                  width: 112
                  height: 76
                  radius: 18
                  widgets:
                    - label: { align: CENTER, text: "${i_backspace_outline}", text_font: mdi_28 }
                  on_click:
                    - script.execute: { id: key_tap, k: 10 }
              - !include { file: ../widgets/key.yaml, vars: { k: 0 } }
              - button:
                  id: key_ok
                  width: 112
                  height: 76
                  radius: 18
                  border_color: ${c_slate}
                  widgets:
                    - label: { align: CENTER, text: "${i_check}", text_font: mdi_28, text_color: "${c_slate}" }
                  on_click:
                    - script.execute: { id: key_tap, k: 11 }
        # mode buttons
        - obj:
            x: 32
            y: 556
            width: 656
            height: 96
            clickable: false
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_BETWEEN
              flex_align_cross: CENTER
              flex_align_track: CENTER
              pad_column: 10
            widgets:
              - button:
                  id: mode_home
                  width: 212
                  height: 96
                  radius: 16
                  layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER, flex_align_track: CENTER, pad_row: 6 }
                  widgets:
                    - label: { id: mode_home_icon, text: "${i_shield_home}", text_font: mdi_28, text_color: "${c_slate}" }
                    - label: { id: mode_home_lbl, text: "Home", text_font: b500_24 }
                  on_click:
                    - script.execute: { id: alarm_mode, mode: "armed_home" }
              - button:
                  id: mode_away
                  width: 212
                  height: 96
                  radius: 16
                  layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER, flex_align_track: CENTER, pad_row: 6 }
                  widgets:
                    - label: { id: mode_away_icon, text: "${i_shield_lock}", text_font: mdi_28, text_color: "${c_slate}" }
                    - label: { id: mode_away_lbl, text: "Away", text_font: b500_24 }
                  on_click:
                    - script.execute: { id: alarm_mode, mode: "armed_away" }
              - button:
                  id: mode_disarm
                  width: 212
                  height: 96
                  radius: 16
                  layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER, flex_align_track: CENTER, pad_row: 6 }
                  widgets:
                    - label: { id: mode_disarm_icon, text: "${i_shield_off}", text_font: mdi_28, text_color: "${c_slate}" }
                    - label: { id: mode_disarm_lbl, text: "Disarm", text_font: b500_24 }
                  on_click:
                    - script.execute: { id: alarm_mode, mode: "disarmed" }
