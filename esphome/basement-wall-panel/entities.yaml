# Basement Wall Panel — Home Assistant entity imports.
#
# Every value the panel shows is subscribed over the native API. Each import
# calls the render script for the part of the UI it feeds; the render scripts
# (logic.yaml) read the current state of every sensor they need, so updates are
# idempotent and ordering does not matter.
#
# Compact "summary" sensors (weather, music, browse, notifications) are built
# on the HA side by packages/basement_wall_panel.yaml so the panel subscribes
# to a handful of strings instead of dozens of attributes.

text_sensor:
  # ---- status bar / weather ----
  - platform: homeassistant
    id: ts_weather_cond
    entity_id: weather.bayberry
    on_value: [script.execute: render_status]
  - platform: homeassistant
    id: ts_alarm
    entity_id: alarm_control_panel.alarmo
    on_value:
      - script.execute: render_status
      - script.execute: render_alarm
  - platform: homeassistant
    id: ts_wx_now
    entity_id: sensor.basement_panel_weather
    attribute: now
    on_value: [script.execute: render_weather]
  - platform: homeassistant
    id: ts_wx_hours
    entity_id: sensor.basement_panel_weather
    attribute: hours
    on_value: [script.execute: render_weather]
  - platform: homeassistant
    id: ts_wx_days
    entity_id: sensor.basement_panel_weather
    attribute: days
    on_value: [script.execute: render_weather]
  - platform: homeassistant
    id: ts_notifs
    entity_id: sensor.basement_panel_notifications
    attribute: items
    on_value: [script.execute: render_notifs]
  # ---- alarm ----
  - platform: homeassistant
    id: ts_garage_door
    entity_id: cover.garage_door_garage
    on_value: [script.execute: render_alarm]
  # ---- shades ----
  - platform: homeassistant
    id: ts_ff_state
    entity_id: cover.first_floor_all
    on_value: [script.execute: render_shades]
  - platform: homeassistant
    id: ts_cv_0
    entity_id: cover.first_floor_all
    on_value: [script.execute: render_shades]
  - platform: homeassistant
    id: ts_cv_1
    entity_id: cover.bedroom_side_shades
    on_value: [script.execute: render_shades]
  - platform: homeassistant
    id: ts_cv_2
    entity_id: cover.bedroom_back
    on_value: [script.execute: render_shades]
  - platform: homeassistant
    id: ts_cv_3
    entity_id: cover.front_guest_bedroom_shades
    on_value: [script.execute: render_shades]
  - platform: homeassistant
    id: ts_cv_4
    entity_id: cover.back_guest_bedroom_shades
    on_value: [script.execute: render_shades]
  - platform: homeassistant
    id: ts_cv_5
    entity_id: cover.office_shades
    on_value: [script.execute: render_shades]
  # ---- music ----
  - platform: homeassistant
    id: ts_players
    entity_id: sensor.basement_panel_music
    attribute: players
    on_value: [script.execute: render_music]
  - platform: homeassistant
    id: ts_browse_title
    entity_id: sensor.basement_panel_music_browse
    attribute: title
  - platform: homeassistant
    id: ts_browse_items
    entity_id: sensor.basement_panel_music_browse
    attribute: items
    on_value: [script.execute: render_browse]
  - platform: homeassistant
    id: ts_recents
    entity_id: sensor.basement_panel_music_recent
    attribute: items
    on_value: [script.execute: render_browse]
  # ---- pool ----
  - platform: homeassistant
    id: ts_heater
    entity_id: water_heater.omnilogic_pool_heater
    on_value: [script.execute: render_pool]
  # ---- maintenance ----
  - platform: homeassistant
    id: ts_wh_flushed
    entity_id: input_datetime.water_heater_last_flushed
    on_value: [script.execute: render_maint]
  - platform: homeassistant
    id: ts_dryer_cleaned
    entity_id: input_datetime.dryer_vent_last_cleaned
    on_value: [script.execute: render_maint]

sensor:
  # ---- status bar ----
  - platform: homeassistant
    id: s_outdoor_temp
    entity_id: sensor.bayberry_tempest_temperature
    on_value: [script.execute: render_status]
  - platform: homeassistant
    id: s_notif_count
    entity_id: sensor.notification_alert_counter
    on_value: [script.execute: render_status]
  - platform: homeassistant
    id: s_pw_charge
    entity_id: sensor.bayberry_charge
    on_value:
      - script.execute: render_status
      - script.execute: render_energy
  # ---- energy ----
  - platform: homeassistant
    id: s_solar
    entity_id: sensor.bayberry_solar_power
    on_value: [script.execute: render_energy]
  - platform: homeassistant
    id: s_grid
    entity_id: sensor.bayberry_site_power
    on_value: [script.execute: render_energy]
  - platform: homeassistant
    id: s_load
    entity_id: sensor.bayberry_load_power
    on_value: [script.execute: render_energy]
  - platform: homeassistant
    id: s_battery
    entity_id: sensor.bayberry_battery_power
    on_value: [script.execute: render_energy]
  - platform: homeassistant
    id: s_reserve
    entity_id: number.bayberry_backup_reserve
    on_value:
      - script.execute: render_energy
      - script.execute: render_hub
  # ---- scenes ----
  - platform: homeassistant
    id: s_sun_elevation
    entity_id: sensor.sun_solar_elevation
    on_value: [script.execute: render_scenes]
  # ---- shades ----
  - platform: homeassistant
    id: s_ff_pos
    entity_id: cover.first_floor_all
    attribute: current_position
    on_value: [script.execute: render_shades]
  - platform: homeassistant
    id: s_cv_0
    entity_id: cover.first_floor_all
    attribute: current_position
    on_value: [script.execute: render_shades]
  - platform: homeassistant
    id: s_cv_1
    entity_id: cover.bedroom_side_shades
    attribute: current_position
    on_value: [script.execute: render_shades]
  - platform: homeassistant
    id: s_cv_2
    entity_id: cover.bedroom_back
    attribute: current_position
    on_value: [script.execute: render_shades]
  - platform: homeassistant
    id: s_cv_3
    entity_id: cover.front_guest_bedroom_shades
    attribute: current_position
    on_value: [script.execute: render_shades]
  - platform: homeassistant
    id: s_cv_4
    entity_id: cover.back_guest_bedroom_shades
    attribute: current_position
    on_value: [script.execute: render_shades]
  - platform: homeassistant
    id: s_cv_5
    entity_id: cover.office_shades
    attribute: current_position
    on_value: [script.execute: render_shades]
  # ---- pool ----
  - platform: homeassistant
    id: s_pool_setpoint
    entity_id: water_heater.omnilogic_pool_heater
    attribute: temperature
    on_value: [script.execute: render_pool]
  - platform: homeassistant
    id: s_water_temp
    entity_id: sensor.omnilogic_pool_watersensor
    on_value: [script.execute: render_pool]
  - platform: homeassistant
    id: s_pump_speed
    entity_id: number.omnilogic_pool_filter_pump_speed
    on_value: [script.execute: render_pool]
  - platform: homeassistant
    id: s_salt
    entity_id: sensor.omnilogic_pool_chlorinator_average_salt_level
    on_value: [script.execute: render_pool]
  - platform: homeassistant
    id: s_chlor_pct
    entity_id: number.omnilogic_pool_chlorinator_timed_percent
    on_value: [script.execute: render_pool]
  # ---- climate values ----
  - platform: homeassistant
    id: s_fa_lr
    entity_id: input_number.living_room_fresh_air_min_temp
    on_value: [script.execute: render_climate]
  - platform: homeassistant
    id: s_fa_bs
    entity_id: input_number.basement_fresh_air_minimum_temp
    on_value: [script.execute: render_climate]
  - platform: homeassistant
    id: s_co2_ceiling
    entity_id: input_number.co2_vent_ceiling
    on_value: [script.execute: render_climate]
  - platform: homeassistant
    id: s_co2_recover
    entity_id: input_number.co2_vent_recover
    on_value: [script.execute: render_climate]
  - platform: homeassistant
    id: s_vent_min
    entity_id: input_number.vent_min_outdoor
    on_value: [script.execute: render_climate]
  - platform: homeassistant
    id: s_vent_max
    entity_id: input_number.vent_max_outdoor
    on_value: [script.execute: render_climate]
  - platform: homeassistant
    id: s_freecool
    entity_id: input_number.freecool_differential
    on_value: [script.execute: render_climate]
  - platform: homeassistant
    id: s_minvent
    entity_id: input_number.minvent_floor_minutes
    on_value: [script.execute: render_climate]
  - platform: homeassistant
    id: s_away_heat
    entity_id: input_number.away_heat_setpoint
    on_value: [script.execute: render_climate]
  - platform: homeassistant
    id: s_away_cool
    entity_id: input_number.away_cool_setpoint
    on_value: [script.execute: render_climate]
  # ---- energy today ----
  - platform: homeassistant
    id: s_e_well
    entity_id: ${well_pump_energy_entity}
    on_value: [script.execute: render_energy_sheet]
  - platform: homeassistant
    id: s_e_pool
    entity_id: sensor.pool_pump_energy
    on_value: [script.execute: render_energy_sheet]
  - platform: homeassistant
    id: s_e_ev
    entity_id: sensor.wall_charger_energy
    on_value: [script.execute: render_energy_sheet]
  # ---- maintenance ----
  - platform: homeassistant
    id: s_upper_filter
    entity_id: input_number.upper_floor_hvac_filter_hours
    on_value: [script.execute: render_maint]
  - platform: homeassistant
    id: s_lower_filter
    entity_id: input_number.lower_floors_hvac_filter_hours
    on_value: [script.execute: render_maint]

