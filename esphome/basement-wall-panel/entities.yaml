  # ---- pool ----
  - platform: homeassistant
    id: bs_pump
    entity_id: switch.omnilogic_pool_filter_pump
    on_state: [script.execute: render_pool]
  # ---- toggle rows (switch id sw_<id> in the sheets) ----
