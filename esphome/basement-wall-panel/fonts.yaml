# Basement Wall Panel — fonts.
#
# Barlow (Google Fonts, OFL) at the exact size/weight pairs the design calls
# for, plus Material Design Icons cut to the glyphs the UI actually uses.
# Naming: b<weight>_<px> for text, mdi_<px> for icons.
#
# Every entry is written out in full on purpose: ESPHome's YAML loader does
# not combine `<<` merge keys with sibling keys, so anchors are only used for
# the glyph lists (plain aliases, not merges).
#
# The MDI TTF is pulled from the MaterialDesign-Webfont repo at build time;
# Barlow comes from Google Fonts. Both are cached by ESPHome after the first
# build (.esphome/fonts).

font:
  # -------------------------------------------------------------- Barlow
  - file: { type: gfonts, family: Barlow, weight: 300 }
    id: b300_64
    size: 64
    bpp: 4
    glyphs: &text_glyphs
      - " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"
      - "°·—–‹›“”‘’…Ω"
  - file: { type: gfonts, family: Barlow, weight: 300 }
    id: b300_60
    size: 60
    bpp: 4
    glyphs: *text_glyphs
  - file: { type: gfonts, family: Barlow, weight: 300 }
    id: b300_34
    size: 34
    bpp: 4
    glyphs: *text_glyphs
