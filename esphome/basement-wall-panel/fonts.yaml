  # ------------------------------------------------------- Material Design Icons
  # Small/medium sizes carry the whole icon set used anywhere in the UI so that
  # any icon can be swapped into any slot; the large sizes only carry what the
  # design actually renders at that size.
  - file: &mdi_file
      type: web
      url: https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf
    id: mdi_24
    size: 24
    bpp: 4
    glyphs: &mdi_all
      - "${i_weather_partly_cloudy}${i_weather_sunny}${i_weather_cloudy}${i_weather_rainy}${i_weather_pouring}${i_weather_snowy}${i_weather_fog}${i_weather_lightning}${i_weather_lightning_rainy}${i_weather_night}${i_weather_night_partly_cloudy}${i_weather_windy}${i_weather_hail}${i_weather_snowy_rainy}${i_weather_partly_rainy}"
      - "${i_shield_off_outline}${i_shield_sync}${i_shield_home}${i_shield_lock}${i_shield_off}${i_shield}${i_alarm_light}${i_bell_outline}${i_bell_check_outline}${i_microphone}${i_power_plug_off}"
      - "${i_check_circle_outline}${i_check_circle}${i_alert_circle_outline}${i_alert_circle}${i_alert_outline}${i_information_outline}${i_backspace_outline}${i_check}${i_chevron_right}${i_chevron_left}${i_close}${i_door}${i_door_sliding}${i_garage_open}${i_door_open}${i_air_filter}"
