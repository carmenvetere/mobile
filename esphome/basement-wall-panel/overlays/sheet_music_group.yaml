obj:
  id: sheet_music_group
  hidden: true
  styles: st_overlay
  widgets:
    - obj:
        styles: st_sheet
        widgets:
          - obj:
              x: 0
              y: 0
              width: 100%
              height: 56
              clickable: false
              layout: { type: FLEX, flex_flow: ROW, flex_align_main: SPACE_BETWEEN, flex_align_cross: CENTER, flex_align_track: CENTER }
              widgets:
                - label: { id: sheet_music_group_title, text: "Speaker group", text_font: b300_32 }
                - !include { file: ../widgets/sheet_close.yaml, vars: { id: close_sheet_music_group } }
          - obj:
              id: sheet_music_group_body
              x: 0
              y: 68
              width: 100%
              height: 516
              scrollable: true
              scroll_dir: VER
              layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: START, flex_align_cross: START, pad_row: 0 }
              widgets:
                - !include { file: ../widgets/speaker_row.yaml, vars: { n: 0 } }
                - !include { file: ../widgets/speaker_row.yaml, vars: { n: 1 } }
                - !include { file: ../widgets/speaker_row.yaml, vars: { n: 2 } }
                - !include { file: ../widgets/speaker_row.yaml, vars: { n: 3 } }
                - !include { file: ../widgets/speaker_row.yaml, vars: { n: 4 } }
                - !include { file: ../widgets/speaker_row.yaml, vars: { n: 5 } }
                - !include { file: ../widgets/speaker_row.yaml, vars: { n: 6 } }
                - !include { file: ../widgets/speaker_row.yaml, vars: { n: 7 } }
