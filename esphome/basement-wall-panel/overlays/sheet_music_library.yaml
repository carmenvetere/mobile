obj:
  id: sheet_music_library
  hidden: true
  styles: st_overlay
  widgets:
    - obj:
        styles: st_sheet
        widgets:
          - obj:
              x: 0
              y: 0
              width: 100%
              height: 56
              clickable: false
              layout: { type: FLEX, flex_flow: ROW, flex_align_main: SPACE_BETWEEN, flex_align_cross: CENTER, flex_align_track: CENTER }
              widgets:
                - label: { id: sheet_music_library_title, text: "Library", text_font: b300_32 }
                - !include { file: ../widgets/sheet_close.yaml, vars: { id: close_sheet_music_library } }
          - obj:
              id: sheet_music_library_body
              x: 0
              y: 68
              width: 100%
              height: 516
              scrollable: true
              scroll_dir: VER
              layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: START, flex_align_cross: START, pad_row: 0 }
              widgets:
                - obj:
                    id: lib_back
                    hidden: true
                    width: 100%
                    height: 44
                    layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, flex_align_track: CENTER, pad_column: 4 }
                    widgets:
                      - label: { text: "${i_chevron_left}", text_font: mdi_24, text_color: "${c_slate}" }
                      - label: { id: lib_back_lbl, text: "Library", text_font: b600_17, text_color: "${c_slate}" }
                    on_click:
                      - script.execute: browse_back
                - !include { file: ../widgets/eyebrow.yaml, vars: { id: lib_eyebrow_recent, text: "RECENTLY PLAYED" } }
                - !include { file: ../widgets/browse_row.yaml, vars: { n: 0, prefix: rc, height: 56, script: recent_tap } }
                - !include { file: ../widgets/browse_row.yaml, vars: { n: 1, prefix: rc, height: 56, script: recent_tap } }
                - !include { file: ../widgets/browse_row.yaml, vars: { n: 2, prefix: rc, height: 56, script: recent_tap } }
                - !include { file: ../widgets/browse_row.yaml, vars: { n: 3, prefix: rc, height: 56, script: recent_tap } }
                - !include { file: ../widgets/browse_row.yaml, vars: { n: 4, prefix: rc, height: 56, script: recent_tap } }
                - !include { file: ../widgets/eyebrow.yaml, vars: { id: lib_eyebrow_library, text: "LIBRARY" } }
                - !include { file: ../widgets/browse_row.yaml, vars: { n: 0, prefix: br, height: 60, script: browse_tap } }
                - !include { file: ../widgets/browse_row.yaml, vars: { n: 1, prefix: br, height: 60, script: browse_tap } }
                - !include { file: ../widgets/browse_row.yaml, vars: { n: 2, prefix: br, height: 60, script: browse_tap } }
                - !include { file: ../widgets/browse_row.yaml, vars: { n: 3, prefix: br, height: 60, script: browse_tap } }
                - !include { file: ../widgets/browse_row.yaml, vars: { n: 4, prefix: br, height: 60, script: browse_tap } }
                - !include { file: ../widgets/browse_row.yaml, vars: { n: 5, prefix: br, height: 60, script: browse_tap } }
                - !include { file: ../widgets/browse_row.yaml, vars: { n: 6, prefix: br, height: 60, script: browse_tap } }
                - !include { file: ../widgets/browse_row.yaml, vars: { n: 7, prefix: br, height: 60, script: browse_tap } }
                - !include { file: ../widgets/browse_row.yaml, vars: { n: 8, prefix: br, height: 60, script: browse_tap } }
                - !include { file: ../widgets/browse_row.yaml, vars: { n: 9, prefix: br, height: 60, script: browse_tap } }
                - !include { file: ../widgets/browse_row.yaml, vars: { n: 10, prefix: br, height: 60, script: browse_tap } }
                - !include { file: ../widgets/browse_row.yaml, vars: { n: 11, prefix: br, height: 60, script: browse_tap } }
                - label: { id: lib_empty, hidden: true, width: 100%, pad_top: 24, text: "Nothing here", text_font: b400_17, text_color: "${c_text3}" }
