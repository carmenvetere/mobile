obj:
  id: sheet_maintenance
  hidden: true
  styles: st_overlay
  widgets:
    - obj:
        styles: st_sheet
        widgets:
          - obj:
              x: 0
              y: 0
              width: 100%
              height: 56
              clickable: false
              layout: { type: FLEX, flex_flow: ROW, flex_align_main: SPACE_BETWEEN, flex_align_cross: CENTER }
              widgets:
                - label: { id: sheet_maintenance_title, text: "Maintenance", text_font: b300_32 }
                - !include { file: ../widgets/sheet_close.yaml, vars: { id: close_sheet_maintenance } }
          - obj:
              id: sheet_maintenance_body
              x: 0
              y: 68
              width: 100%
              height: 516
              scrollable: true
              scroll_dir: VER
              layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: START, flex_align_cross: START, pad_row: 0 }
              widgets:
                - !include { file: ../widgets/eyebrow.yaml, vars: { id: mt_eyebrow_dates, text: "SERVICE DATES" } }
                - !include { file: ../widgets/reset_row.yaml, vars: { id: upper, name: "Upper HVAC filter", sub: "Replace at 2,000 h" } }
                - !include { file: ../widgets/reset_row.yaml, vars: { id: lower, name: "Lower HVAC filter", sub: "Replace at 2,000 h" } }
                - !include { file: ../widgets/reset_row.yaml, vars: { id: wh, name: "Water heater flushed", sub: "Every 6 months" } }
                - !include { file: ../widgets/reset_row.yaml, vars: { id: dryer, name: "Dryer vent cleaned", sub: "Every 12 months" } }
                - !include { file: ../widgets/eyebrow.yaml, vars: { id: mt_eyebrow_notes, text: "RELEASE NOTES" } }
                - obj:
                    id: row_notes
                    width: 100%
                    height: 64
                    styles: st_hairline_bottom
                    layout: { type: FLEX, flex_flow: ROW, flex_align_main: SPACE_BETWEEN, flex_align_cross: CENTER }
                    widgets:
                      - obj:
                          clickable: false
                          width: SIZE_CONTENT
                          height: SIZE_CONTENT
                          layout: { type: FLEX, flex_flow: COLUMN, flex_align_cross: START, pad_row: 2 }
                          widgets:
                            - label: { text: "Mobile dashboard", text_font: b500_20 }
                            - label: { text: "v2.4.1 · Aug 22, 2026", text_font: b400_15, text_color: "${c_text3}" }
                      - obj:
                          clickable: false
                          width: SIZE_CONTENT
                          height: SIZE_CONTENT
                          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 4 }
                          widgets:
                            - label: { text: "What's new", text_font: b600_16, text_color: "${c_slate}" }
                            - label: { text: "${i_chevron_right}", text_font: mdi_24, text_color: "${c_slate}" }
                    on_click:
                      - script.execute:
                          id: open_sheet
                          name: release_notes
