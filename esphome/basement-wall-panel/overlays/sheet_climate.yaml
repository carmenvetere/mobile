obj:
  id: sheet_climate
  hidden: true
  styles: st_overlay
  widgets:
    - obj:
        styles: st_sheet
        widgets:
          - obj:
              x: 0
              y: 0
              width: 100%
              height: 56
              clickable: false
              layout: { type: FLEX, flex_flow: ROW, flex_align_main: SPACE_BETWEEN, flex_align_cross: CENTER }
              widgets:
                - label: { id: sheet_climate_title, text: "Climate", text_font: b300_32 }
                - !include { file: ../widgets/sheet_close.yaml, vars: { id: close_sheet_climate } }
          - obj:
              id: sheet_climate_body
              x: 0
              y: 68
              width: 100%
              height: 516
              scrollable: true
              scroll_dir: VER
              layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: START, flex_align_cross: START, pad_row: 0 }
              widgets:
                - !include { file: ../widgets/eyebrow.yaml, vars: { id: cl_eyebrow_zones, text: "ZONE SCHEDULES" } }
                - !include { file: ../widgets/toggle_row.yaml, vars: { id: z_lr, name: "Living Room", sub: "Schedule v3", entity: automation.living_room_hvac_schedule_v3 } }
                - !include { file: ../widgets/toggle_row.yaml, vars: { id: z_bs, name: "Basement", sub: "Schedule", entity: automation.basement_hvac_schedule } }
                - !include { file: ../widgets/toggle_row.yaml, vars: { id: z_of, name: "Office", sub: "Schedule v2", entity: automation.office_thermostat_schedule_v2 } }
                - !include { file: ../widgets/toggle_row.yaml, vars: { id: z_bd, name: "Bedroom", sub: "Schedule", entity: automation.bedroom_hvac_schedule } }
                - !include { file: ../widgets/eyebrow.yaml, vars: { id: cl_eyebrow_fresh, text: "FRESH AIR" } }
                - !include { file: ../widgets/value_row.yaml, vars: { id: fa_lr, name: "Living Room min temp", sub: "Fresh-air floor" } }
                - !include { file: ../widgets/value_row.yaml, vars: { id: fa_bs, name: "Basement min temp", sub: "Fresh-air floor" } }
                - !include { file: ../widgets/eyebrow.yaml, vars: { id: cl_eyebrow_vent, text: "VENTILATION THRESHOLDS" } }
                - !include { file: ../widgets/value_row.yaml, vars: { id: co2_ceiling, name: "CO2 vent ceiling", sub: "Start flushing above" } }
                - !include { file: ../widgets/value_row.yaml, vars: { id: co2_recover, name: "CO2 vent recover", sub: "Stop flushing below" } }
                - !include { file: ../widgets/value_row.yaml, vars: { id: vent_range, name: "Vent outdoor range", sub: "Damper opens between" } }
                - !include { file: ../widgets/value_row.yaml, vars: { id: freecool, name: "Free cooling differential", sub: "Outdoor cooler than indoor by" } }
                - !include { file: ../widgets/value_row.yaml, vars: { id: minvent, name: "Min ventilation / 24h", sub: "Guaranteed fresh-air minutes" } }
                - !include { file: ../widgets/eyebrow.yaml, vars: { id: cl_eyebrow_away, text: "AWAY SETPOINTS" } }
                - !include { file: ../widgets/value_row.yaml, vars: { id: away_heat, name: "Heat", sub: "While away" } }
                - !include { file: ../widgets/value_row.yaml, vars: { id: away_cool, name: "Cool", sub: "While away" } }
