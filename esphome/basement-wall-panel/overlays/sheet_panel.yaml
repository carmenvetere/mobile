obj:
  id: sheet_panel
  hidden: true
  styles: st_overlay
  widgets:
    - obj:
        styles: st_sheet
        widgets:
          - obj:
              x: 0
              y: 0
              width: 100%
              height: 56
              clickable: false
              layout: { type: FLEX, flex_flow: ROW, flex_align_main: SPACE_BETWEEN, flex_align_cross: CENTER, flex_align_track: CENTER }
              widgets:
                - label: { id: sheet_panel_title, text: "Panel & Voice", text_font: b300_32 }
                - !include { file: ../widgets/sheet_close.yaml, vars: { id: close_sheet_panel } }
          - obj:
              id: sheet_panel_body
              x: 0
              y: 68
              width: 100%
              height: 516
              scrollable: true
              scroll_dir: VER
              layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: START, flex_align_cross: START, pad_row: 0 }
              widgets:
                - !include { file: ../widgets/eyebrow.yaml, vars: { id: pv_eyebrow_display, text: "DISPLAY" } }
                - !include { file: ../widgets/stepper_row.yaml, vars: { id: brightness, name: "Brightness", sub: "Backlight", script: step_brightness } }
                - !include { file: ../widgets/eyebrow.yaml, vars: { id: pv_eyebrow_voice, text: "VOICE" } }
                - obj:
                    id: row_wake
                    width: 100%
                    height: 64
                    styles: st_hairline_bottom
                    layout: { type: FLEX, flex_flow: ROW, flex_align_main: SPACE_BETWEEN, flex_align_cross: CENTER, flex_align_track: CENTER }
                    widgets:
                      - obj:
                          clickable: false
                          width: SIZE_CONTENT
                          height: SIZE_CONTENT
                          layout: { type: FLEX, flex_flow: COLUMN, flex_align_cross: START, pad_row: 2 }
                          widgets:
                            - label: { text: "Wake word", text_font: b500_19 }
                            - label: { text: "“Okay Nabu” · on-device", text_font: b400_14, text_color: "${c_text3}" }
                      - switch:
                          id: sw_wake
                          ext_click_area: 14
                          on_click:
                            - switch.toggle: wake_word_enabled
                - !include { file: ../widgets/stepper_row.yaml, vars: { id: voicevol, name: "Voice volume", sub: "Assistant replies", script: step_voice_volume } }
                - !include { file: ../widgets/eyebrow.yaml, vars: { id: pv_eyebrow_system, text: "SYSTEM" } }
                - !include { file: ../widgets/value_row.yaml, vars: { id: wifi, name: "Wi-Fi", sub: "—" } }
                - !include { file: ../widgets/value_row.yaml, vars: { id: fw, name: "Firmware", sub: "ESPHome · LVGL 9" } }
