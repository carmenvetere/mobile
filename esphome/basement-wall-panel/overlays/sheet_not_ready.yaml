obj:
  id: sheet_not_ready
  hidden: true
  styles: st_overlay
  widgets:
    - obj:
        styles: st_sheet
        widgets:
          - obj:
              x: 0
              y: 0
              width: 100%
              height: 56
              clickable: false
              layout: { type: FLEX, flex_flow: ROW, flex_align_main: SPACE_BETWEEN, flex_align_cross: CENTER }
              widgets:
                - label: { id: sheet_not_ready_title, text: "Sensors", text_font: b300_32 }
                - !include { file: ../widgets/sheet_close.yaml, vars: { id: close_sheet_not_ready } }
          - obj:
              id: sheet_not_ready_body
              x: 0
              y: 68
              width: 100%
              height: 516
              scrollable: true
              scroll_dir: VER
              layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: START, flex_align_cross: START, pad_row: 0 }
              widgets:
                - label: { id: not_ready_sub, width: 100%, pad_bottom: 10, text: "All 6 sensors closed", text_font: b400_16, text_color: "${c_text3}" }
                - !include { file: ../widgets/door_row.yaml, vars: { n: 0, name: "Front Door", icon: "${i_door}" } }
                - !include { file: ../widgets/door_row.yaml, vars: { n: 1, name: "Kitchen French Doors", icon: "${i_door_sliding}" } }
                - !include { file: ../widgets/door_row.yaml, vars: { n: 2, name: "Living Room French Doors", icon: "${i_door_sliding}" } }
                - !include { file: ../widgets/door_row.yaml, vars: { n: 3, name: "Mudroom Entry Door", icon: "${i_door}" } }
                - !include { file: ../widgets/door_row.yaml, vars: { n: 4, name: "Garage Entry", icon: "${i_door}" } }
                - !include { file: ../widgets/door_row.yaml, vars: { n: 5, name: "Garage Door", icon: "${i_garage_open}" } }
