# Read-only value row: name (+ sub) left, slate value right.
# vars: id, name, sub
obj:
  id: row_${id}
  width: 100%
  height: 60
  styles: st_hairline_bottom
  layout:
    type: FLEX
    flex_flow: ROW
    flex_align_main: SPACE_BETWEEN
    flex_align_cross: CENTER
  widgets:
    - obj:
        clickable: false
        width: SIZE_CONTENT
        height: SIZE_CONTENT
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_cross: START
          pad_row: 2
        widgets:
          - label:
              text: "${name}"
              text_font: b400_19
          - label:
              id: vsub_${id}
              text: "${sub}"
              text_font: b400_14
              text_color: ${c_text3}
    - label:
        id: val_${id}
        text: "—"
        text_font: b600_22
        text_color: ${c_slate}
