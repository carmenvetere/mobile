# Notification row. Filled by render_notifs.
# vars: n
obj:
  id: nf_row_${n}
  width: 100%
  height: 92
  hidden: true
  styles: st_hairline_bottom
  layout:
    type: FLEX
    flex_flow: ROW
    flex_align_cross: CENTER
    flex_align_track: CENTER
    pad_column: 14
  widgets:
    - label:
        id: nf_icon_${n}
        width: 34
        text: "${i_information_outline}"
        text_align: CENTER
        text_font: mdi_30
        text_color: ${c_text3}
    - obj:
        clickable: false
        flex_grow: 1
        height: SIZE_CONTENT
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_cross: START
          pad_row: 2
        widgets:
          - label:
              id: nf_title_${n}
              width: 100%
              text: ""
              text_font: b600_21
              long_mode: DOT
          - label:
              id: nf_body_${n}
              width: 100%
              text: ""
              text_font: b400_16
              text_color: ${c_text2}
              long_mode: DOT
          - label:
              id: nf_time_${n}
              text: ""
              text_font: b500_14
              text_color: ${c_text3}
    - button:
        id: nf_dismiss_${n}
        width: 56
        height: 56
        radius: 28
        border_width: 0
        widgets:
          - label:
              align: CENTER
              text: "${i_close}"
              text_font: mdi_24
              text_color: ${c_text3}
        on_click:
          - script.execute:
              id: notif_dismiss
              n: ${n}
