# Maintenance row: name 20/500 + sub 15, value 26/600 colored by threshold, RESET pill.
# vars: id, name, sub
obj:
  id: row_${id}
  width: 100%
  height: 76
  styles: st_hairline_bottom
  layout:
    type: FLEX
    flex_flow: ROW
    flex_align_main: SPACE_BETWEEN
    flex_align_cross: CENTER
  widgets:
    - obj:
        clickable: false
        width: SIZE_CONTENT
        height: SIZE_CONTENT
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_cross: START
          pad_row: 2
        widgets:
          - label:
              id: mname_${id}
              text: "${name}"
              text_font: b500_20
          - label:
              text: "${sub}"
              text_font: b400_15
              text_color: ${c_text3}
    - obj:
        clickable: false
        width: SIZE_CONTENT
        height: 44
        layout:
          type: FLEX
          flex_flow: ROW
          flex_align_cross: CENTER
          pad_column: 14
        widgets:
          - label:
              id: mval_${id}
              width: 110
              text: "—"
              text_align: RIGHT
              text_font: b600_26
              text_color: ${c_sage}
          - button:
              id: mbtn_${id}
              width: 84
              height: 44
              radius: 22
              widgets:
                - label:
                    id: mbtn_lbl_${id}
                    align: CENTER
                    text: "RESET"
                    text_font: b600_14
                    text_letter_space: 1
                    text_color: ${c_text2}
              on_click:
                - script.execute:
                    id: maint_reset
                    which: "${id}"
