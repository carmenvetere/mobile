# Release-notes version header row: "vX.Y.Z" 22/600 slate + date 15 text-3, hairline underline.
# vars: v, d
obj:
  width: 100%
  height: 44
  styles: st_hairline_bottom
  clickable: false
  layout: { type: FLEX, flex_flow: ROW, flex_align_cross: END, pad_column: 12 }
  widgets:
    - label: { text: "${v}", text_font: b600_22, text_color: "${c_slate}", pad_bottom: 6 }
    - label: { text: "${d}", text_font: b400_15, text_color: "${c_text3}", pad_bottom: 8 }
