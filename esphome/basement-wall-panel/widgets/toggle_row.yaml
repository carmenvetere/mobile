# Settings-sheet toggle row: name + sub on the left, 68×36 switch on the right.
# vars: id, name, sub, entity
obj:
  id: row_${id}
  width: 100%
  height: 64
  styles: st_hairline_bottom
  layout:
    type: FLEX
    flex_flow: ROW
    flex_align_main: SPACE_BETWEEN
    flex_align_cross: CENTER
  widgets:
    - obj:
        clickable: false
        width: SIZE_CONTENT
        height: SIZE_CONTENT
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_cross: START
          pad_row: 2
        widgets:
          - label:
              text: "${name}"
              text_font: b500_19
          - label:
              id: sub_${id}
              text: "${sub}"
              text_font: b400_14
              text_color: ${c_text3}
    - switch:
        id: sw_${id}
        ext_click_area: 14
        on_click:
          - script.execute:
              id: ha_toggle
              entity: "${entity}"
              turn_on: !lambda "return panel::is_checked(id(sw_${id}));"
