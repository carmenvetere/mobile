# Stepper row: name + sub, then [−] value [+].
# vars: id, name, sub, script
obj:
  id: row_${id}
  width: 100%
  height: 72
  styles: st_hairline_bottom
  layout:
    type: FLEX
    flex_flow: ROW
    flex_align_main: SPACE_BETWEEN
    flex_align_cross: CENTER
    flex_align_track: CENTER
  widgets:
    - obj:
        clickable: false
        width: SIZE_CONTENT
        height: SIZE_CONTENT
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_cross: START
          pad_row: 2
        widgets:
          - label:
              text: "${name}"
              text_font: b500_19
          - label:
              text: "${sub}"
              text_font: b400_14
              text_color: ${c_text3}
    - obj:
        clickable: false
        width: SIZE_CONTENT
        height: 48
        layout:
          type: FLEX
          flex_flow: ROW
          flex_align_cross: CENTER
          flex_align_track: CENTER
          pad_column: 10
        widgets:
          - button:
              width: 48
              height: 48
              radius: 24
              widgets:
                - label:
                    align: CENTER
                    text: "${i_minus}"
                    text_font: mdi_24
                    text_color: ${c_slate}
              on_click:
                - script.execute:
                    id: ${script}
                    delta: -1
          - label:
              id: val_${id}
              width: 84
              text: "—"
              text_align: CENTER
              text_font: b600_22
              text_color: ${c_slate}
          - button:
              width: 48
              height: 48
              radius: 24
              widgets:
                - label:
                    align: CENTER
                    text: "${i_plus}"
                    text_font: mdi_24
                    text_color: ${c_slate}
              on_click:
                - script.execute:
                    id: ${script}
                    delta: 1
