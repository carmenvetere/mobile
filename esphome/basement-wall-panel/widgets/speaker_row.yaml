# Speakers sheet row. Filled by render_group.
# Tap the row to make that speaker the one the Music page controls; the
# round button on the right joins it to / removes it from that speaker's group.
# vars: n
obj:
  id: grp_row_${n}
  width: 100%
  height: 64
  styles: st_hairline_bottom
  pad_left: 4
  pad_right: 4
  layout:
    type: FLEX
    flex_flow: ROW
    flex_align_cross: CENTER
    flex_align_track: CENTER
    pad_column: 14
  widgets:
    - label:
        id: grp_icon_${n}
        width: 30
        text: ""
        text_align: CENTER
        text_font: mdi_26
        text_color: ${c_text3}
    - obj:
        clickable: false
        flex_grow: 1
        height: SIZE_CONTENT
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_cross: START
          pad_row: 1
        widgets:
          - label:
              id: grp_name_${n}
              text: ""
              text_font: b500_19
              text_color: ${c_text2}
          - label:
              id: grp_sub_${n}
              text: ""
              text_font: b400_14
              text_color: ${c_text3}
    # shown on the row the page is controlling
    - label:
        id: grp_mark_${n}
        text: "${i_check_circle}"
        text_font: mdi_24
        text_color: ${c_slate}
    # join / leave the controlled speaker's group
    - button:
        id: grp_join_${n}
        width: 48
        height: 48
        radius: 24
        widgets:
          - label:
              id: grp_join_icon_${n}
              align: CENTER
              text: "${i_plus}"
              text_font: mdi_24
              text_color: ${c_slate}
        on_click:
          - script.execute:
              id: group_toggle
              n: ${n}
  on_click:
    - script.execute:
        id: group_focus
        n: ${n}
