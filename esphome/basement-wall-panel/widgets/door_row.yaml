# Not-ready sheet sensor row.
# vars: n, name, icon
obj:
  id: door_row_${n}
  width: 100%
  height: 64
  styles: st_hairline_bottom
  layout:
    type: FLEX
    flex_flow: ROW
    flex_align_cross: CENTER
    pad_column: 14
  widgets:
    - label:
        id: door_icon_${n}
        width: 32
        text: "${icon}"
        text_align: CENTER
        text_font: mdi_26
        text_color: ${c_slate}
    - label:
        flex_grow: 1
        text: "${name}"
        text_font: b500_20
    - label:
        id: door_state_${n}
        text: "Closed"
        text_font: b600_16
        text_color: ${c_slate}
