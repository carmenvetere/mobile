mobile_separator_small:
  name: Mobile Separator (small)
  version: '1.0'
  creator: ''
  supported:
    - separator
  description: >-
    Room-level sub-section header (v2.7): 16px title, 14px sub-buttons,
    same hairline rule as mobile_separator. Used inside expanders where the
    expander's own title is already the 20px section header.
  code: |-
    .bubble-name {
      font-size: 16px !important;
      font-weight: 700 !important;
      color: var(--primary-text-color) !important;
    }
    .bubble-sub-button {
      font-size: 14px !important;
      font-weight: 700 !important;
      color: var(--primary-text-color) !important;
      background: transparent !important;
      border: none !important;
    }
    .bubble-line {
      background: var(--primary-text-color) !important;
      opacity: 0.1 !important;
    }
    .card-content {
      padding-top: 7px !important;
    }
  editor: ''
